var KB_BOOKS = [{"title": "Règles communes", "md": "\n# OTIS — Books de passation ADV par agence\n\n2026-10-21 · Alexandre CHANTRY\n\n\n## Mode d'emploi et règles communes\n\nUn onglet par flux OTIS : chaque ADV qui reprend un compte y trouve qui contacter, quoi saisir au BR, comment découper et libeller la facture, et quoi contrôler avant envoi.\n\nSources : 6 ateliers internes avec Fethi (comptes rendus par agence), process de facturation OTIS, grilles OTIS 2022, Tours 2023 et Transport 2023, export Odoo des devis (oct. 2025 – sept. 2026), règles de calcul de la plateforme (v6). AG 58 est décrit à partir des règles déjà validées dans la plateforme, son compte rendu d'atelier n'ayant pas été joint.\n\n\n### Calendrier mensuel (tous flux)\n\n1. Fil de l'eau : réceptions saisies le jour même, BR complet (client = entité de facturation, code contremaître, n° de commande au format de l'agence).\n2. Dernier jour ouvré du mois : relance des colis non identifiés et des devis cas 1 sans OJ.\n3. J+1 à J+3 du mois suivant : export Odoo WMS (Fichier Manutention + Fichier Client Stockage) par entité, dépôt dans la plateforme (onglet Import).\n4. J+3 à J+5 : traitement des anomalies bloquantes (onglet Anomalies), génération des factures.\n5. J+5 à J+8 : création des devis / factures Odoo à partir des pro forma, envoi.\n6. J+10 : dépôt des PDF Odoo dans Contrôle factures, écart à 0,00 €, clôture du mois.\n\nPratique constatée en 2026 : devis créés entre le 4 (AG 495, AG 496) et le 13 (GDN) du mois suivant.\n\n\n### Règles communes\n\n- Odoo WMS est la seule source. Aucune donnée saisie hors Odoo ne fonde une facture.\n- Grille standard OTIS 2022 (01/04/2022) : entrée et sortie 9,27 € par unité payante (UP = max(m³ ; t)), minimum 4,89 € au chariot, 3,80 € à la main (< 0,25 m³ et ≤ 20 kg). Stockage par m² facturé = volume × coefficient (2,68 / 3,22 / 3,74 / 4,30 selon le volume), 6,76 € le mois (≥ 22 jours), 3,38 € la quinzaine, 1,77 € la semaine. Valeurs arrondies du PDF ; le moteur applique les valeurs exactes du contrat XLS (9,2664 € ; 4,888 / 3,796 € ; coefficients 2,6832 / 3,224 / 3,744 / 4,2952 ; semaine 1,768 €).\n- Clause « 30 m² minimum par appareil » : abandonnée (décision du 02/10/2026), ne jamais la facturer.\n- Lignes de facture Odoo : « PRESTATION LOGISTIQUE - ENTREES », « PRESTATION LOGISTIQUE - SORTIES », « [STOCK] PRESTATION LOGISTIQUE - STOCKAGE ».\n- Objet normalisé : « LOGISTIQUE – <MOIS AAAA> – <clé> ». Mois de facturation au format AAAA-MM.\n- Destination : boîte eFactures OTIS (contact « Envoi factures … » de l'entité dans Odoo).\n- Cas 1 : devis → attendre le n° de commande OTIS (OJ…) → facture. Cas 2 : facture sans commande.\n- Toute incohérence Odoo se signale (onglet Anomalies), elle ne se corrige pas à la main dans la facture.\n\n\n## Tableau de bord des 9 flux\n\n- AG 495 ; Entité Odoo facturée : OTIS CN AG 495 Résidentiel ; Modèle : Cas 2 ; Une facture par : Affaire ; Grille : Standard 2022 ; Factures / mois : 22 ; CA logistique 12 mois (€ HT) : 144 580 ; Interlocuteur clé : Cindy (affaires), A. Papin (responsable)\n- AG 496 ; Entité Odoo facturée : OTIS CN AG 496 Major Project ; Modèle : Cas 2 ; Une facture par : Affaire ; Grille : Standard 2022 ; Factures / mois : 28 ; CA logistique 12 mois (€ HT) : 484 886 ; Interlocuteur clé : Cindy (affaires), A. Granger (responsable)\n- CRA ; Entité Odoo facturée : AG 495 (1 BU) et AG 496 (2 BU) ; Modèle : Cas 2 ; Une facture par : BU ; Grille : Standard 2022 ; Factures / mois : 3 ; CA logistique 12 mois (€ HT) : 95 336 ; Interlocuteur clé : Contremaîtres CRA, M. Rubio\n- Tour Link ; Entité Odoo facturée : OTIS CN AG 496 - Tour Link ; Modèle : Cas 1 ; Une facture par : Mois ; Grille : Tours 2023 ; Factures / mois : 1 ; CA logistique 12 mois (€ HT) : 10 315 ; Interlocuteur clé : C. Stelbel\n- Tour Triangle ; Entité Odoo facturée : OTIS CN AG 496 - Tour Triangle ; Modèle : Cas 1 ; Une facture par : Mois ; Grille : Tours 2023 ; Factures / mois : 1 ; CA logistique 12 mois (€ HT) : 45 563 ; Interlocuteur clé : N. Clément\n- AG 58 ; Entité Odoo facturée : OTIS TERTIAIRE AG 58 ; Modèle : Cas 1 ; Une facture par : Contremaître × Contrats / FHR ; Grille : Standard 2022 ; Factures / mois : 32 ; CA logistique 12 mois (€ HT) : 274 639 ; Interlocuteur clé : Contremaîtres AG 58\n- NSA ; Entité Odoo facturée : NSA ; Modèle : Cas 2 (à confirmer) ; Une facture par : Appareil + Outillage ; Grille : Standard 2022 ; Factures / mois : 4 à 5 ; CA logistique 12 mois (€ HT) : 39 817 ; Interlocuteur clé : C. Kirsch\n- GDN ; Entité Odoo facturée : GDN ; Modèle : Non formalisé ; Une facture par : Demande ; Grille : Spécifique GDN ; Factures / mois : 1 ; CA logistique 12 mois (€ HT) : 13 456 ; Interlocuteur clé : B. Brichet\n- OTIS FRANCE ; Entité Odoo facturée : OTIS FRANCE ; Modèle : Cas 1 ; Une facture par : Appareil ; Grille : Standard 2022 (à confirmer) ; Factures / mois : 1 ; CA logistique 12 mois (€ HT) : 18 115 ; Interlocuteur clé : S. Lagasse\n\nVolumes : export Odoo des devis étiquetés Logistique, non annulés, mois de facturation oct. 2025 – sept. 2026. Pour CRA et les Tours, montants identifiés dans les devis AG 495 / 496 par l'objet ou le contact. Tour Link et Tour Triangle sont facturés sur leurs auxiliaires dédiés à partir d'octobre 2026.\n"}, {"title": "AG 495", "md": "\n# Book de passation — AG 495\n\nAG 495 (résidentiel) se facture chaque mois sans commande, une facture par n° d'affaire avec tous ses appareils : tout repose sur un BR qui porte « APPAREIL / AFFAIRE ».\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS CN AG 495 Résidentiel\n- Destinataire facture : OTIS CN AG 495 Résidentiel, Envoi factures OTIS AG 495 CN — 23 rue Delarivière Lefoullon, 92800 Puteaux — SIRET 542 107 800 04123, TVA FR72542107800\n- Responsable OTIS : Antoine Papin\n- Source des n° d'affaire et codes contremaître : Cindy (OTIS)\n- Marchandise : Appareils neufs uniquement\n- Process OTIS : Cas 2 : pas de devis envoyé, pas de commande\n- Grille : Standard OTIS 2022\n- Volume 12 mois : 269 factures (22 / mois), médiane 377 € HT, 144 580 € HT\n- À côté : CRA BU 307002100 facturée sur cette entité (onglet CRA) ; transport 88 549 € HT (164 livraisons)\n\n\n## 2. Réception\n\n1. Un BR par appareil.\n2. Lire le n° d'appareil sur le BL fournisseur (8 caractères). Préfixe N ou K = appareil neuf, à réceptionner ici ; préfixe S ou UA = CRA, voir l'onglet CRA.\n3. Si le n° d'affaire ou le code contremaître manque : demande à Cindy.\n4. Retrouver le nom du contremaître et l'entité dans Inventaire physique à partir du code.\n5. Remplir le BR :\n\n- Fournisseur : Celui du BL fournisseur\n- Client : OTIS CN AG 495 Résidentiel\n- Contremaître / Contact : Nom du contremaître\n- Code contremaître : Code à 5 chiffres (495xx)\n- N° de commande : APPAREIL / AFFAIRE, ex. 45K1BZY5 / 45KRXI9F\n- Saisie manuelle adresse : Adresse de livraison finale si elle figure sur le BL\n\nRègle : un appareil n'a qu'une seule affaire. N° d'affaire = 8 caractères (ex. 45KRX000).\n\n\n## 3. Préparation et expédition\n\n- Appareil complet : dans « Saisie automatique », taper le n° d'appareil, le bon reprend tous ses colis.\n- Préparation partielle : un BR complet, ou une liste de colis / produits transmise par le contremaître (« que la partie mécanique », « que les gueuses »).\n- Priorisation : feuille récapitulative imprimée par l'ADV pour les caristes (cible : bon de préparation Odoo).\n- Fin de chargement sur la tablette : signature du BL par le chauffeur, photos du chargement, photo de la CMR.\n- Reste à quai : pas de procédure à ce jour.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les deux fichiers de l'entité (Manutention, Client Stockage) et les déposer dans la plateforme (onglet Import).\n2. Lever les anomalies bloquantes : ligne sans affaire (retour chantier : reprendre l'appareil, puis l'historique du colis, sinon saisie ADV), Client = False.\n3. Générer : une facture par affaire, tous ses appareils regroupés.\n4. Créer le devis dans Odoo (non envoyé), puis la facture.\n\n- Objet : LOGISTIQUE – <MOIS AAAA>\n- N° de commande : Affaire : <n°> – Appareils : <n°>, <n°>…\n- Code contremaître : Celui de l'affaire (1 affaire = 1 contremaître)\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Sur demande\n- Envoi : eFactures OTIS\n\nExemple réel : FAC-26-09-113 du 30/09/2026 (devis D-26-12208), objet « LOGISTIQUE SEPTEMBRE 2026 », affaire 45KRXI9F, appareils 45K1BZY2 à 45K1BZY5.\n\nCôté OTIS, la facture part en comptabilité sur la base du n° d'affaire : un n° d'affaire faux ou absent = facture bloquée chez OTIS.\n\n\n## 5. Contrôles avant envoi\n\n- Aucune ligne sans affaire ni Client = False\n- Aucun appareil rattaché à deux affaires (cas réel août 2026 : 45K1CL53 sous 45KRXPG et 45KRXLPG, affaire tronquée)\n- Aucune réception CRA (client OTIS CRA) saisie par erreur sur AG 495\n- Code contremaître renseigné sur chaque devis\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Contacts\n\n- Cindy ; Rôle : OTIS AG 495 / 496 ; Pour quoi : N° d'affaire et code contremaître à partir du n° d'appareil\n- Antoine Papin ; Rôle : Responsable AG 495 ; Pour quoi : Litige, escalade\n- Thierry Guillaume (49510), Mehdi Karour (49552), Sébastien Almeida Gaspar (49560), El Ghalia Qjaouj (49570), Marc Ancelet (49580), Alexandre Pery (49581) ; Rôle : Contremaîtres (codes du CR CRA) ; Pour quoi : Identification de la marchandise, préparations partielles\n"}, {"title": "AG 496", "md": "\n# Book de passation — AG 496\n\nAG 496 (Major Project) est le premier compte OTIS (485 k€ HT de logistique sur 12 mois) et suit exactement la même règle qu'AG 495 : sans commande, une facture par affaire avec ses appareils.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS CN AG 496 Major Project\n- Destinataire facture : OTIS CN AG 496 Major Project, Envoi facture OTIS AG 496 CN\n- Responsable OTIS : Arnaud Granger\n- Source des n° d'affaire et codes contremaître : Cindy (OTIS)\n- Marchandise : Appareils neufs uniquement\n- Process OTIS : Cas 2 : pas de devis envoyé, pas de commande\n- Grille : Standard OTIS 2022\n- Volume 12 mois : 336 factures (28 / mois), médiane 870 € HT, 484 886 € HT (hors CRA et Tours)\n- À côté : CRA BU 307002300 et 307002200 facturées sur cette entité (onglet CRA) ; Tours sur leurs auxiliaires dédiés depuis octobre 2026 ; transport 282 609 € HT (487 livraisons) ; emballage 28 172 € HT\n\n\n## 2. Réception\n\n1. Un BR par appareil.\n2. Lire le n° d'appareil sur le BL fournisseur (8 caractères). Préfixe N ou K = appareil neuf, à réceptionner ici ; préfixe S ou UA = CRA, voir l'onglet CRA.\n3. Si le n° d'affaire ou le code contremaître manque : demande à Cindy.\n4. Retrouver le nom du contremaître et l'entité dans Inventaire physique à partir du code.\n5. Marchandise destinée à Tour Link ou Tour Triangle : ne pas la réceptionner ici, voir les onglets Tours.\n6. Remplir le BR :\n\n- Fournisseur : Celui du BL fournisseur\n- Client : OTIS CN AG 496 Major Project\n- Contremaître / Contact : Nom du contremaître\n- Code contremaître : Code à 5 chiffres (496xx, 497xx)\n- N° de commande : APPAREIL / AFFAIRE, ex. 45K1BZY5 / 45KRXI9F\n- Saisie manuelle adresse : Adresse de livraison finale si elle figure sur le BL\n\nRègle : un appareil n'a qu'une seule affaire. N° d'affaire = 8 caractères.\n\n\n## 3. Préparation et expédition\n\n- Appareil complet : dans « Saisie automatique », taper le n° d'appareil.\n- Préparation partielle : un BR complet, ou une liste de colis / produits transmise par le contremaître.\n- Priorisation : feuille récapitulative imprimée par l'ADV (cible : bon de préparation Odoo).\n- Fin de chargement sur la tablette : signature du BL par le chauffeur, photos du chargement, photo de la CMR.\n- Reste à quai : pas de procédure à ce jour.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les deux fichiers de l'entité (Manutention, Client Stockage) et les déposer dans la plateforme. L'export Stockage AG 496 ne contient ni dates, ni type de stockage, ni prix : la plateforme reprend les dates des mouvements du mois.\n2. Lever les anomalies bloquantes : ligne sans affaire, Client = False.\n3. Vérifier qu'aucune réception CRA (client OTIS CRA) ni Tours (auxiliaires Tour Link / Tour Triangle) n'a été saisie par erreur sur Major Project ; si oui, corriger le client dans Odoo avant de générer.\n4. Générer : une facture par affaire, tous ses appareils regroupés.\n5. Créer le devis dans Odoo (non envoyé), puis la facture.\n\n- Objet : LOGISTIQUE – <MOIS AAAA>\n- N° de commande : Affaire : <n°> – Appareils : <n°>, <n°>…\n- Code contremaître : Celui de l'affaire (1 affaire = 1 contremaître)\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Sur demande\n- Envoi : eFactures OTIS\n\nCôté OTIS, la facture part en comptabilité sur la base du n° d'affaire : un n° faux ou absent bloque le paiement.\n\n\n## 5. Contrôles avant envoi\n\n- Aucune ligne sans affaire ni Client = False\n- Aucun appareil rattaché à deux affaires\n- Aucune ligne CRA ni Tours dans les factures par affaire\n- Contremaître J.-B. Favreau : vérifier le code (49632 au CR CRA, aussi relevé sous 49630 dans Odoo)\n- Code contremaître renseigné sur chaque devis\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Contacts\n\n- Cindy ; Rôle : OTIS AG 495 / 496 ; Pour quoi : N° d'affaire et code contremaître\n- Arnaud Granger ; Rôle : Responsable AG 496 ; Pour quoi : Litige, escalade\n- Marc Rubio ; Rôle : Achats matériels OTIS ; Pour quoi : Fournisseurs internationaux sans référence\n- Abderrahmane Amrouche (49621), Jean-Paul Miguel (49630), Ousmane Diaw (49631), Jean-Baptiste Favreau (49632), Dérito Domingos (49661), Joaquim Pereira (49662), Christophe Prieur (49663), Romain Caroff (49720) ; Rôle : Contremaîtres BU 307002300 ; Pour quoi : Identification, préparations\n- Fabien Hamnane (49611), Marcello Rodrigues-Pinto (49612), Bruno Aquino (49613), Vincent Vitte (49641), Philippe Lihoreau (49650) ; Rôle : Contremaîtres BU 307002200 ; Pour quoi : Identification, préparations\n"}, {"title": "CRA", "md": "\n# Book de passation — CRA\n\nCRA (compte rendu d'anomalies : retours de chantier, manquants, casses, vols) est réceptionné sur le client OTIS CRA et facturé chaque mois en 3 factures, une par BU : 2 sur AG 496, 1 sur AG 495, avec annexe.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo (réception et extraction) : OTIS CRA\n- Entités facturées : OTIS CN AG 496 Major Project (BU 307002300, BU 307002200) ; OTIS CN AG 495 Résidentiel (BU 307002100)\n- Équivalent : Le FHR de l'AG 58\n- Règle de rattachement : Une affaire = un contremaître ; un contremaître = une BU\n- Process OTIS : Cas 2 : pas de devis envoyé, pas de commande\n- Grille : Standard OTIS 2022\n- Volume 12 mois : 36 factures (3 / mois), médiane 2 261 € HT, 95 336 € HT (~7,9 k€ / mois)\n\n\n## 2. Réception\n\nQuatre cas, selon l'origine de la marchandise.\n\n1. Déduire le contremaître du n° de contrat.\n2. Sans code contremaître : appeler le responsable EPC, puis mail à tous les contremaîtres CRA.\n3. En attendant : zone d'attente (aucune existence dans Odoo).\n4. Dès confirmation : créer le BR avec la date d'arrivée réelle dans « Force date », et vérifier qu'Odoo l'a prise en compte.\n5. N° de commande : le n° de contrat (= n° d'appareil), ou « EPC » s'il n'y en a pas.\n\n1. N° de contrat obligatoire (= n° d'appareil), reporté dans le n° de commande.\n2. Sans code contremaître : mail à tous les contremaîtres CRA et à Marc Rubio (achats matériels).\n3. Zone d'attente puis BR avec « Force date », comme pour EPC.\n\n1. Le contremaître est toujours identifiable : appeler le fournisseur (n° de commande interne OTIS + nom du contremaître), à défaut mail groupé aux contremaîtres, ou Marc Rubio pour l'international.\n2. N° de commande : le n° d'appareil, ou le n° de commande qu'OTIS a passé au fournisseur (ex. OH45880682). Jamais le n° propre du fournisseur.\n3. Si le BL porte un n° d'affaire : ce n'est pas du CRA, réceptionner sur AG 495 ou AG 496.\n\n1. N° de commande = « Retour Chantier ».\n2. Toujours affecter un contremaître.\n\nExemple réel : LGA/BR/06252 du 11/09/2026, fournisseur Inmac wstore, client OTIS CRA, contremaître El Ghalia Qjaouj (49570), n° de commande OH45880682.\n\n\n## 3. Préparation et expédition\n\nProcess standard, préparation à la demande du contremaître. Rien de spécifique décrit en atelier.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers Manutention et Client Stockage du client OTIS CRA, les déposer dans la plateforme.\n2. Affecter chaque ligne à sa BU par le code contremaître (table ci-dessous). Ligne sans contremaître ou contremaître hors table = bloquante.\n3. Générer 3 factures, une par BU, chacune sur l'entité de la BU.\n4. Joindre l'annexe Excel (entrées / sorties et stockage) à chaque facture.\n\n- 307002300 ; Entité facturée : AG 496 ; Contremaîtres (code) : Amrouche (49621), Miguel (49630), Diaw (49631), Favreau (49632), Domingos (49661), Pereira (49662), Prieur (49663), Caroff (49720)\n- 307002200 ; Entité facturée : AG 496 ; Contremaîtres (code) : Hamnane (49611), Rodrigues-Pinto (49612), Aquino (49613), Vitte (49641), Lihoreau (49650)\n- 307002100 ; Entité facturée : AG 495 ; Contremaîtres (code) : Guillaume (49510), Karour (49552), Almeida Gaspar (49560), Qjaouj (49570), Ancelet (49580), Pery (49581)\n\n- Objet : LOGISTIQUE – <MOIS AAAA> – CRA BU <n°>\n- N° de commande : N.A\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Oui, toujours : tableau Excel entrées / sorties + stockage\n- Envoi : eFactures OTIS de l'entité (AG 495 ou AG 496)\n\nExemple réel, septembre 2026 : D-26-12285 (BU 307002300, 2 406,36 € HT), D-26-12286 (BU 307002200, 4 687,14 € HT), D-26-12287 (BU 307002100, 1 100,24 € HT).\n\n\n## 5. Contrôles avant envoi\n\n- Exactement 3 factures : 2 sur AG 496, 1 sur AG 495 (en juillet 2026, 2 factures sont parties sur AG 495 : D-26-10922 et D-26-10924)\n- Aucune ligne sans contremaître\n- Les réceptions sorties de zone d'attente portent bien leur « Force date » (stockage dès l'arrivée réelle)\n- Annexe jointe à chacune des 3 factures\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Évolutions demandées en atelier\n\n- Case à cocher « Retour chantier » sur le BR, appliquée à tous ses articles et reportée dans l'annexe.\n- Un seul fichier Manutention et stockage au lieu de deux.\n\n\n## 7. Contacts\n\n- Responsable EPC ; Rôle : Filiale OTIS ; Pour quoi : Contremaître d'une réception EPC\n- Marc Rubio ; Rôle : Achats matériels informatiques OTIS ; Pour quoi : Contremaître et n° de contrat, OTIS Chine / USA et fournisseurs internationaux\n- Contremaîtres CRA ; Rôle : Voir table des BU ; Pour quoi : Identification de la marchandise\n"}, {"title": "Tour Link", "md": "\n# Book de passation — Tour Link\n\nTour Link est un grand projet AG 496 facturé à la grille spéciale Tours : une facture par mois, après validation du devis par Caroline Stelbel et réception de son n° de commande OJ.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS CN AG 496 - Tour Link (auxiliaire dédié, facturé sous ce nom à partir d'octobre 2026)\n- Historique : Facturé sous OTIS FRANCE au 1er semestre 2025, puis sous AG 496 Major Project (contact C. Stelbel) jusqu'en septembre 2026\n- Interlocutrice OTIS : Caroline Stelbel (devis, commande, relance)\n- Process OTIS : Cas 1 : devis → n° de commande OJ → facture\n- Grille : Grille Tours « Opération Tour The Link » du 01/01/2023\n- Volume 12 mois : 7 factures identifiables, 10 315 € HT ; tendance en baisse (1 937,82 € en août, 582,32 € en septembre 2026)\n\n\n## 2. Grille Tours (01/01/2023)\n\n- Entrée ; Prix HT : 8,71 € ; Unité / condition : m³ / t, au-delà de 0,500 m³\n- Sortie ; Prix HT : 8,71 € ; Unité / condition : m³ / t, au-delà de 0,500 m³\n- Minimum chariot ou transpalette ; Prix HT : 4,65 € ; Unité / condition : 0,250 à 0,490 m³, plus de 20 kg\n- Minimum manuel ; Prix HT : 3,68 € ; Unité / condition : moins de 0,250 m³ et moins de 20 kg\n- Stockage intérieur ; Prix HT : 6,44 € / 3,30 € / 1,73 € ; Unité / condition : m² au mois (à partir du 22e jour) / quinzaine (14 jours) / semaine (7 jours)\n- Stockage extérieur ; Prix HT : 4,95 € / 2,54 € / 1,33 € ; Unité / condition : m² au mois / quinzaine / semaine\n- Surface facturée ; Prix HT : × 1,50 ; Unité / condition : Coefficient sur la surface au sol du matériel\n\nDifférences avec la grille standard : 8,71 € au lieu de 9,27 €, minimums 4,65 / 3,68 € au lieu de 4,89 / 3,80 €, surface = surface au sol × 1,50 (et non volume × coefficient). Tarif « valable pour des surfaces supérieures à 450 m² ». Options (manutentionnaire, cariste, chariot 2 à 15 t, location chariot 3,5 t à 2 200 € / mois) sur demande.\n\n\n## 3. Réception\n\n1. Un BR par livraison fournisseur (et non par appareil).\n2. Remplir le BR :\n\n- Fournisseur : Celui du BL\n- Client : OTIS CN AG 496 - Tour Link\n- Code contremaître : Obligatoire\n- N° de commande : N° d'appareil, ou « Retour chantier », ou référence du BL (règle à préciser)\n\n\n## 4. Préparation et expédition\n\nProcess standard, préparation selon le besoin exprimé par le client.\n\n\n## 5. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers du client OTIS CN AG 496 - Tour Link, les déposer dans la plateforme (grille Tours paramétrée sur l'agence).\n2. Générer la pro forma du mois, créer le devis Odoo, l'envoyer à Caroline Stelbel.\n3. À réception du n° OJ : facture.\n4. Sans OJ à J+7 : relancer Caroline Stelbel.\n\n- Objet : LOGISTIQUE – <MOIS AAAA> – TOUR LINK\n- N° de commande : N° de commande OTIS (OJ…)\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Sur demande\n- Envoi : eFactures OTIS\n\nExemple réel : D-26-12292, « LOGISTIQUE SEPTEMBRE 2026 - TOUR LINK », 582,32 € HT (encore sous AG 496 Major Project).\n\n\n## 6. Contrôles avant envoi\n\n- Grille Tours appliquée (8,71 €, surface au sol × 1,50), pas la grille standard\n- Le mot « TOUR LINK » figure dans l'objet : sans lui, la facture n'est plus traçable (5 mois sur 12 non identifiables en 2025-2026)\n- N° OJ reçu et reporté\n- Pas de devis global de contrôle créé puis annulé\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 7. Points ouverts\n\n- Stockage intérieur ou extérieur : règle d'affectation non décrite en atelier.\n- Seuil « surfaces supérieures à 450 m² » : tarif applicable en dessous ?\n- Règle de n° de commande sur le BR « autres détails selon BL » à préciser.\n\n\n## 8. Contacts\n\n- Caroline Stelbel ; Rôle : OTIS, Tour Link ; Pour quoi : Validation du devis, n° OJ, relance\n"}, {"title": "Tour Triangle", "md": "\n# Book de passation — Tour Triangle\n\nTour Triangle suit la même règle que Tour Link : grille spéciale Tours, une facture par mois après validation du devis par Nicolas Clément et réception du n° OJ.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS CN AG 496 - Tour Triangle (auxiliaire dédié, facturé sous ce nom à partir d'octobre 2026)\n- Historique : Facturé sous AG 496 en 2024, sous OTIS FRANCE au 1er semestre 2025, puis sous AG 496 Major Project (contact N. Clément) jusqu'en septembre 2026\n- Interlocuteur OTIS : Nicolas Clément (devis, commande, relance)\n- Process OTIS : Cas 1 : devis → n° de commande OJ → facture\n- Grille : Grille Tours du 01/01/2023 (document titré « Opération Tour The Link », appliqué par extension)\n- Volume 12 mois : 8 factures identifiables, 45 563 € HT ; en baisse (8 845 € en janvier, 3 268 € en septembre 2026)\n\n\n## 2. Grille\n\nMêmes valeurs que Tour Link (onglet Tour Link, section 2) : entrée et sortie 8,71 € au m³ / t, minimums 4,65 / 3,68 €, stockage intérieur 6,44 / 3,30 / 1,73 €, extérieur 4,95 / 2,54 / 1,33 €, surface au sol × 1,50.\n\n\n## 3. Réception\n\n1. Un BR par livraison fournisseur.\n2. Remplir le BR :\n\n- Fournisseur : Celui du BL\n- Client : OTIS CN AG 496 - Tour Triangle\n- Code contremaître : Obligatoire\n- N° de commande : N° d'appareil, ou « Retour chantier », ou référence du BL (règle à préciser)\n\n\n## 4. Préparation et expédition\n\nProcess standard, préparation selon le besoin exprimé par le client.\n\n\n## 5. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers du client OTIS CN AG 496 - Tour Triangle, les déposer dans la plateforme (grille Tours paramétrée sur l'agence).\n2. Générer la pro forma du mois, créer le devis Odoo, l'envoyer à Nicolas Clément.\n3. À réception du n° OJ : facture.\n4. Sans OJ à J+7 : relancer Nicolas Clément.\n\n- Objet : LOGISTIQUE – <MOIS AAAA> – TOUR TRIANGLE\n- N° de commande : N° de commande OTIS (OJ…)\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Sur demande\n- Envoi : eFactures OTIS\n\nExemple réel : D-26-12293, « LOGISTIQUE SEPTEMBRE 2026 - TOUR TRIANGLE », 3 268,17 € HT (encore sous AG 496 Major Project).\n\n\n## 6. Contrôles avant envoi\n\n- Grille Tours appliquée, pas la grille standard\n- « TOUR TRIANGLE » dans l'objet (5 mois sur 12 non identifiables en 2025-2026)\n- N° OJ reçu et reporté\n- Pas de devis global de contrôle. Les devis de contrôle 2026 étaient 14 à 28 % au-dessus du facturé (avril : 11 006,72 € contre 8 607,29 € ; juin : 8 230,81 € contre 7 201,75 € ; juillet : 5 175,74 € contre 4 090,37 €) sans explication écrite\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 7. Points ouverts\n\n- Confirmation écrite d'OTIS que la grille « Tour The Link » s'applique à Tour Triangle.\n- Stockage intérieur ou extérieur, seuil de 450 m² : comme Tour Link.\n\n\n## 8. Contacts\n\n- Nicolas Clément ; Rôle : OTIS, Tour Triangle ; Pour quoi : Validation du devis, n° OJ, relance\n"}, {"title": "AG 58", "md": "\n# Book de passation — AG 58\n\nAG 58 (OTIS Tertiaire) produit le plus grand nombre de factures OTIS : deux par contremaître et par mois (Contrats et FHR), chacune après devis validé et n° OJ.\n\nBook établi à partir des règles validées dans la plateforme (document « AGENCE_58.v2 ») et des devis Odoo ; le compte rendu d'atelier AG 58 est à joindre pour compléter la réception et la préparation.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS TERTIAIRE AG 58\n- Destinataire facture : OTIS TERTIAIRE AG 58, Envoi factures OTIS AG 58\n- Process OTIS : Cas 1 : devis (pro forma titrée « Devis pro forma ») → n° OJ → facture\n- Grille : Standard OTIS 2022\n- Volume 12 mois : 388 factures (32 / mois), médiane 170 € HT, 274 639 € HT ; transport 11 177 € HT (24 livraisons)\n- Minimum : Aucun : 106 factures sous 60 € en 12 mois\n\n\n## 2. Réception\n\n- Client : OTIS TERTIAIRE AG 58, <contremaître>\n- Contremaître / Contact : Nom du contremaître\n- Code contremaître : Code à 5 chiffres (ex. 58515)\n- N° de commande, contrat : CONTRAT-APPAREIL / AFFAIRE, ex. 45SHG507 / 45SL0JDU\n- N° de commande, FHR : Doit contenir « FHR » : c'est ce mot qui envoie la ligne sur la facture FHR\n\nExemple réel : LGA/BR/06421 du 30/09/2026, fournisseur OTIS GIEN, client OTIS TERTIAIRE AG 58, Baptiste Bodoville, code 58515, n° de commande 45SHG507 / 45SL0JDU.\n\nLes n° AG 58 ne suivent pas le format 45K… des agences 495 / 496 (ex. affaire 100MMEO, appareil GAA26140M381) : pas de blocage « affaire non identifiée » sur cette agence.\n\n\n## 3. Préparation et expédition\n\nProcess standard. À compléter avec le compte rendu d'atelier.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers du client OTIS TERTIAIRE AG 58, les déposer dans la plateforme.\n2. La plateforme sépare chaque contremaître en deux factures : Contrats (n° de commande sans « FHR ») et FHR (n° de commande contenant « FHR », majuscules ou minuscules).\n3. Créer et envoyer un devis par facture au contremaître.\n4. À réception de l'OJ : facture. Sans OJ à J+7 : relance du contremaître.\n\n- Objet ; Contrats : LOGISTIQUE – <MOIS AAAA> – CONTRATS ; FHR : LOGISTIQUE – <MOIS AAAA> – FHR\n- N° de commande ; Contrats : OJ reçu pour ce contremaître et ce type ; FHR : OJ reçu pour ce contremaître et ce type\n- Code contremaître ; Contrats : Code Odoo du contremaître ; FHR : Code Odoo du contremaître\n- Lignes ; Contrats : Entrées, Sorties, Stockage ; FHR : Entrées, Sorties, Stockage\n- Annexe ; Contrats : Non ; FHR : Non\n\nExemple réel, septembre 2026 : Frédéric Delompre, « Logistique Septembre 2026 - Contrats » 4 270,62 € HT et « - FHR » 897,24 € HT ; Gary Héloïse, Contrats 5 600,86 € HT et FHR 13,79 € HT.\n\nContrôle des PDF Odoo : la facture AG 58 ne porte ni affaire ni appareil, et le code contremaître y est vide (FAC-26-09-156, -157, -195). Le seul lien est l'OJ : la plateforme le mémorise par contremaître et type à la première association validée par un administrateur.\n\n\n## 5. Contrôles avant envoi\n\n- Par contremaître : une facture Contrats et une facture FHR au plus, selon les lignes du mois\n- Aucune ligne FHR sur une facture Contrats (mot « FHR » dans le n° de commande du BR)\n- OJ reçu et reporté ; code contremaître renseigné (vide sur les factures de septembre 2026)\n- Pas de devis global de contrôle (25 789,93 € annulé en septembre 2026)\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Contacts\n\n- Baptiste Bodoville, Bruno Mathé, Christophe Raccouard, Christopher Rabearivony, David Olivier, Edigar Formoso, Frédéric Delompre, Gary Héloïse, Guillaume Paget, Jean-François Nadeau, Manuel Salgado, Nicolas Jarvis, Olgierd Swierzy, Patrick Volte, Philippe Da Cunha, Thierry Dufay, Victor De Sousa ; Rôle : Contremaîtres AG 58 (contacts Odoo) ; Pour quoi : Devis, n° OJ, relance\n"}, {"title": "NSA", "md": "\n# Book de passation — NSA\n\nNSA se facture chaque mois à Christophe Kirsch : une facture par appareil, plus une facture « Outillages » pour tout ce qui n'a pas de n° d'appareil, sans annexe ni minimum.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : NSA (contact Christophe Kirsch)\n- Interlocuteur OTIS : Christophe Kirsch (n° d'appareil manquant, n° de commande)\n- Marchandise : Appareils neufs, outillage neuf, retours de chantier\n- Process OTIS : Cas 2 selon le document « Process de facturation OTIS » ; l'atelier demande pourtant un n° de commande OJ / ON / OH transmis par C. Kirsch (à trancher)\n- Grille : Standard OTIS 2022\n- Minimum : Aucun\n- Volume 12 mois : 54 factures (4 à 5 / mois), médiane 337 € HT, 39 817 € HT ; transport 17 842 € HT (25 livraisons)\n\n\n## 2. Réception\n\n- Client : NSA\n- N° de commande, appareil : N° d'appareil, 8 caractères (ex. R5K7C325, R5N7A728)\n- N° de commande, retour : « Retour Chantier »\n- N° de commande, outillage : Laisser sans n° d'appareil : la ligne ira sur la facture Outillages\n\nN° d'appareil absent du BL : demander à Christophe Kirsch avant de valider le BR.\n\n\n## 3. Préparation et expédition\n\nProcess standard. Rien de spécifique décrit en atelier.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers du client NSA, les déposer dans la plateforme.\n2. Une facture par n° d'appareil (8 caractères) présent dans le mois.\n3. Une facture Outillages pour toutes les lignes sans n° d'appareil (y compris, par conséquent, les retours de chantier).\n4. N° de commande : celui reçu de C. Kirsch (OJ…, ON… ou OH…).\n\n- Objet ; Facture appareil : LOGISTIQUE – <MOIS AAAA> – <n° appareil> ; Facture outillage : LOGISTIQUE – <MOIS AAAA> – OUTILLAGES\n- N° de commande ; Facture appareil : N° reçu de C. Kirsch ; Facture outillage : N° reçu de C. Kirsch\n- Lignes ; Facture appareil : Entrées, Sorties, Stockage ; Facture outillage : Entrées, Sorties, Stockage\n- Annexe ; Facture appareil : Jamais ; Facture outillage : Jamais\n\nExemple réel, septembre 2026 : D-26-12288 Outillage 28,61 € HT ; D-26-12289 R5K7C325 553,99 € HT ; D-26-12290 R5N7A728 7,11 € HT ; D-26-12291 R5N7C007 168,45 € HT.\n\n\n## 5. Contrôles avant envoi\n\n- Une facture par appareil, une seule facture Outillages\n- Aucun code de 8 caractères de type appareil resté sur la facture Outillages\n- N° de commande de C. Kirsch reporté\n- Pas de devis global de contrôle (728,38 € annulé en septembre 2026)\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Points ouverts\n\n- Cas 1 ou cas 2 : contradiction entre le process OTIS et l'atelier.\n- Retours de chantier facturés sur la facture Outillages : à confirmer avec C. Kirsch.\n- Devis D-26-08831 « LOGISTIQUE AVRIL 2026 », 5 144,35 € HT, resté au statut Devis : facturer ou annuler.\n- Le CR d'atelier illustre NSA avec un BR AG 58 et une facture AG 495 : produire une facture modèle NSA.\n\n\n## 7. Contacts\n\n- Christophe Kirsch ; Rôle : OTIS, NSA ; Pour quoi : N° d'appareil, n° de commande, destinataire des factures\n- Séverine Guillot ; Rôle : OTIS, NSA ; Pour quoi : Demandes de transport (vue dans Odoo)\n"}, {"title": "GDN", "md": "\n# Book de passation — GDN\n\nGDN se facture aujourd'hui demande par demande, sur une grille propre non contractualisée (10 € / 10 € / 8 €/m²/mois, minimum 60 €) ; un passage à une facture mensuelle sur devis et OJ est en discussion.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : GDN, <nom du contact>\n- Interlocuteur principal : Bruno Brichet (90 % des demandes, seul présent en France)\n- Process OTIS : Non formalisé (facture sans devis envoyé)\n- Grille : Spécifique GDN, non écrite (« à mettre par Fethi sur le drive »)\n- Minimum : 60 € par demande\n- Annexe : Non\n- Volume 12 mois : 12 factures logistiques, médiane 90 € HT, 13 456 € HT (dont 4 factures « E/S + stockage + empotage » en février 2026 pour 12 346 €) ; emballage 19 371 € HT (14 devis)\n\n\n## 2. Grille GDN (orale, à contractualiser)\n\n- Entrée ; Prix HT : 10 € ; Base : Unité à préciser (colis ou BR)\n- Sortie ; Prix HT : 10 € ; Base : Unité à préciser (colis ou BR)\n- Stockage ; Prix HT : 8 € ; Base : m² / mois, surface tirée des dimensions du BR, depuis la date d'entrée\n- Minimum ; Prix HT : 60 € ; Base : Par demande\n\n\n## 3. Réception\n\n1. Le BL porte toujours un n° d'affaire ou d'appareil : le reporter dans le n° de commande du BR.\n2. Sinon : demander à Bruno Brichet, à défaut aux autres contremaîtres GDN.\n3. Client : GDN, <contact demandeur>.\n\n\n## 4. Préparation et expédition\n\n1. La demande arrive par mail sur logistique@legaa.fr, avec un n° d'affaire ou d'appareil.\n2. Avec emballage : Fethi établit un devis d'emballage (non envoyé, n° de commande = affaire ou appareil) et envoie le rapport d'emballage. Seul l'emballage est facturé, pas la logistique.\n3. Sans emballage : mission de préparation à la logistique, colisage repris du BR, préparation au BR.\n4. Enlèvement par GDN.\n\n\n## 5. Facturation mensuelle\n\n1. Fin de mois : réunir le dossier de chaque demande (mail du client, BR, BL).\n2. Calculer : entrées et sorties à 10 €, stockage à 8 €/m²/mois (dimensions et date d'entrée lues sur le BR).\n3. Total de la demande sous 60 € : facturer 60 €. Sinon : appliquer la grille.\n\n- Client ; Cas général : GDN, <contact> ; Cas minimum (< 60 €) : GDN, <contact>\n- N° de commande ; Cas général : Référence du client : affaire ou appareil ; Cas minimum (< 60 €) : Référence du client : affaire ou appareil\n- Lignes ; Cas général : « Gestion Entrées / sorties – BR n°… » et « Stockage – BR n°… (nombre de mois) » ; Cas minimum (< 60 €) : Une ligne, code article Entrée/Sortie, libellé « Entrées / sorties + stockage – BR n°… », 60 €\n- Annexe ; Cas général : Non ; Cas minimum (< 60 €) : Non\n- Envoi ; Cas général : eFactures OTIS ; Cas minimum (< 60 €) : eFactures OTIS\n\nExemples réels, septembre 2026 : D-26-12372 (Bruno Brichet) et D-26-12375 (Taoufik Merja), « GESTION E/S + STOCKAGE », 60,00 € HT chacun.\n\n\n## 6. Contrôles avant envoi\n\n- Une demande avec emballage n'a pas de facture logistique en plus du devis d'emballage\n- Tous les n° de BR de la demande sont cités dans les libellés\n- Minimum de 60 € appliqué sur la demande, pas sur chaque ligne\n- N° de commande = la référence donnée par le client\n\n\n## 7. Évolution en discussion (Etienne Kieffer / Fethi)\n\nAligner GDN sur le process standard Odoo : une facture mensuelle par entité, pour tous les contremaîtres, sur devis (devis → commande OJ), avec un n° de BU et une annexe (format et colonnes à valider). Préalable : la grille GDN écrite et signée.\n\n\n## 8. Contacts\n\n- Bruno Brichet : Demandes, n° d'affaire et d'appareil (90 %)\n- Cédric Leroux : Contact principal de la fiche GDN\n- Mme N. Delacour : Boîte eFactures fournisseurs\n- Hanane Mouhtach, Hayat Mabchour, Mostafa Sayed, Saloua Agourdi, Taoufik Merja : Contremaîtres demandeurs\n"}, {"title": "OTIS FRANCE", "md": "\n# Book de passation — OTIS FRANCE\n\nOTIS FRANCE est un petit compte (un seul contremaître, Stephen Lagasse à Amiens, réceptions venant de Gien) facturé sur devis et OJ, une facture par appareil ; c'est aussi la porte d'entrée pour faire de LEGAA la plateforme logistique OTIS des Hauts-de-France.\n\n\n## 1. Fiche d'identité\n\n- Client Odoo : OTIS FRANCE, Stephen Lagasse\n- Interlocuteur OTIS : Stephen Lagasse (Amiens), seul contremaître utilisateur à ce jour\n- Origine des réceptions : OTIS Gien uniquement\n- Process OTIS : Cas 1 : devis → n° OJ → facture\n- Grille : Standard OTIS 2022 (non précisé en atelier, à confirmer)\n- Volume 12 mois : 11 factures, 18 115 € HT, dont 5 « Mise à disposition d'un local de stockage » à 2 350 € (oct. 2025 – fév. 2026) ; transport 11 255 € HT (26 livraisons)\n\n\n## 2. Réception\n\n1. Le contremaître prévient en général par mail avant l'arrivée.\n2. Un BR par appareil.\n3. Remplir le BR :\n\n- Client : OTIS FRANCE, Stephen Lagasse\n- Contremaître / code : Aucun\n- N° de commande : N° d'appareil, lu sur le BL (ex. 45N1CU25)\n\nSans n° d'appareil sur le BL : mail à Stephen Lagasse avant validation. Le but est que le contremaître retrouve sa marchandise.\n\n\n## 3. Préparation et expédition\n\nProcess standard, préparation au n° d'appareil.\n\n\n## 4. Facturation mensuelle\n\n1. Extraire d'Odoo WMS les fichiers du client OTIS FRANCE, les déposer dans la plateforme.\n2. Un devis par appareil, envoyé à Stephen Lagasse.\n3. À réception de l'OJ : facture. Sans OJ à J+7 : relance.\n\n- Objet : LOGISTIQUE – <MOIS AAAA> – <n° appareil>\n- N° de commande : N° de commande OTIS (OJ…)\n- Lignes : Entrées, Sorties, Stockage\n- Annexe : Sur demande\n- Envoi : eFactures OTIS\n\nExemples réels : D-26-12589 « LOGISTIQUE Appareil : 45N1CU25 », 480,54 € HT (envoyé le 19/10/2026, OJ attendu) ; D-26-08276 « LOGISTIQUE APPAREIL 45K1CEX1 », 358,31 € HT (mars 2026). Le transport du même appareil fait l'objet d'un devis séparé (D-26-12158, GLP Saint-Witz, 637 € HT).\n\n\n## 5. Contrôles avant envoi\n\n- Une facture par appareil, n° d'appareil dans l'objet\n- OJ reçu et reporté\n- Pas de devis global de contrôle\n- Écart PDF Odoo / plateforme = 0,00 € avant clôture\n\n\n## 6. Points ouverts\n\n- Grille applicable à confirmer.\n- Mise à disposition du local à 2 350 € / mois : devis de mars 2026 annulé, plus rien depuis. Fin de contrat à confirmer par écrit.\n- Développement : contacter les autres contremaîtres OTIS de la région susceptibles d'utiliser la plateforme (action commerciale identifiée en atelier).\n\n\n## 7. Contacts\n\n- Stephen Lagasse ; Rôle : Contremaître OTIS, Amiens ; Pour quoi : Préavis de réception, n° d'appareil, devis, OJ\n- Ludovic Lessene, Romain Bouchet ; Rôle : Contacts OTIS FRANCE (transport) ; Pour quoi : Demandes de transport\n"}];
var KB_SYN = "\n# OTIS — Synthèse des ateliers et préconisations\n\n2026-10-21 · Alexandre CHANTRY\n\n\n## Synthèse exécutive\n\nOTIS pèse 1,19 M€ HT de logistique sur 12 mois (oct. 2025 – sept. 2026), facturés via ~100 devis par mois selon 7 logiques de découpage différentes : la complexité vient du process, pas du volume.\n\nSources : 6 ateliers internes avec Fethi (comptes rendus AG 495, AG 496, Tour Link, Tour Triangle, NSA, GDN, OTIS FRANCE, CRA), process de facturation OTIS, grilles tarifaires 2022 / Tours 2023 / Transport 2023, export Odoo des devis et bons de commande (12 094 lignes, dont 3 213 OTIS, oct. 2024 – 21/10/2026).\n\nCinq constats structurants :\n\n1. AG 496 (y compris CRA et Tours refacturés), AG 58 et AG 495 font 89 % du CA logistique OTIS. NSA, GDN et OTIS FRANCE pèsent ensemble 6 %, mais chacune a ses propres règles.\n2. Chaque mois, pour AG 495, AG 496, AG 58, CRA, les Tours et NSA (GDN jusqu'en novembre 2025), l'ADV crée d'abord un devis global de contrôle, puis l'annule et le ré-éclate à la main en N devis. 99 devis logistique OTIS annulés en 12 mois, pour ~1 190 devis valides.\n3. N° d'affaire, n° d'appareil, contremaître sont obtenus par mail auprès de 6 interlocuteurs OTIS différents. En attendant, la marchandise CRA est en zone d'attente sans existence dans Odoo : le stockage de cette période n'est tracé que par la « Force date ».\n4. Les Tours ne sont pas identifiables dans les devis valides sur 5 mois sur 12 (objet générique sous AG 496) ; en juillet 2026 la refacturation CRA porte 2 devis sur AG 495 et 1 sur AG 496 au lieu de 1 et 2.\n5. La grille GDN (10 € / 10 € / 8 €/m²/mois, minimum 60 €) n'est pas formalisée ; la grille Tours est titrée « Tour The Link » et appliquée par extension à Tour Triangle.\n\nDécisions à prendre (détail en sections Préconisations générales et Roadmap par agence) :\n\n- Ramener les 9 logiques à 3 modèles de facturation paramétrés dans la plateforme, sans devis de contrôle.\n- Rendre l'affaire, l'appareil et le code contremaître bloquants à la création du BR, avec un détenteur « À identifier » pour que le stockage démarre au jour 1.\n- Formaliser par avenant la grille GDN et l'extension de la grille Tours à Tour Triangle.\n- Générer systématiquement une annexe ligne à ligne depuis la plateforme, envoyée ou non selon l'agence.\n\n\n## Périmètre et volumétrie (12 mois)\n\nSur 12 mois, la logistique OTIS représente 1,19 M€ HT sur ~1 190 devis valides, le transport 0,41 M€ HT sur 730 devis et l'emballage 55 k€ HT.\n\n- AG 496 (hors CRA et Tours) ; Devis logistique / mois : 28,0 ; Montant médian (€ HT) : 870 ; Devis annulés 12 mois : 15 ; Transport 12 mois (€ HT) : 282 609 ; Emballage 12 mois (€ HT) : 28 172\n- AG 58 ; Devis logistique / mois : 32,3 ; Montant médian (€ HT) : 170 ; Devis annulés 12 mois : 12 ; Transport 12 mois (€ HT) : 11 177 ; Emballage 12 mois (€ HT) : 663\n- AG 495 ; Devis logistique / mois : 22,4 ; Montant médian (€ HT) : 377 ; Devis annulés 12 mois : 11 ; Transport 12 mois (€ HT) : 88 549 ; Emballage 12 mois (€ HT) : 5 506\n- CRA ; Devis logistique / mois : 3,0 ; Montant médian (€ HT) : 2 261 ; Devis annulés 12 mois : 12 ; Transport 12 mois (€ HT) : — ; Emballage 12 mois (€ HT) : —\n- Tour Triangle ; Devis logistique / mois : 0,7 ; Montant médian (€ HT) : 5 646 ; Devis annulés 12 mois : 10 ; Transport 12 mois (€ HT) : — ; Emballage 12 mois (€ HT) : —\n- NSA ; Devis logistique / mois : 4,5 ; Montant médian (€ HT) : 337 ; Devis annulés 12 mois : 9 ; Transport 12 mois (€ HT) : 17 842 ; Emballage 12 mois (€ HT) : —\n- OTIS FRANCE ; Devis logistique / mois : 0,9 ; Montant médian (€ HT) : 2 350 ; Devis annulés 12 mois : 4 ; Transport 12 mois (€ HT) : 11 255 ; Emballage 12 mois (€ HT) : —\n- GDN ; Devis logistique / mois : 1,0 ; Montant médian (€ HT) : 90 ; Devis annulés 12 mois : 2 ; Transport 12 mois (€ HT) : — ; Emballage 12 mois (€ HT) : 19 371\n- Tour Link ; Devis logistique / mois : 0,6 ; Montant médian (€ HT) : 1 473 ; Devis annulés 12 mois : 11 ; Transport 12 mois (€ HT) : — ; Emballage 12 mois (€ HT) : —\n\nLecture et réserves :\n\n- CRA, Tour Link et Tour Triangle n'ont aucun devis valide à leur nom : leurs devis sont tous annulés et refacturés sous AG 495 / AG 496. Les montants ci-dessus sont ceux identifiables par l'objet ou le contact du devis refacturé.\n- OTIS FRANCE inclut 5 « Mise à disposition d'un local de stockage » à 2 350 € (oct. 2025 – fév. 2026) ; celle de mars 2026 est annulée et la ligne s'arrête ensuite.\n- AG 51 (51 k€) et AG 55 (10 k€) ne figurent pas dans les 8 entités citées et n'ont plus de devis logistique depuis février 2026 : statut à confirmer.\n- Le compte rendu d'atelier AG 58 n'a pas été fourni avec les autres ; son mode de facturation est repris des règles déjà validées dans la plateforme (document « AGENCE_58.v2 »).\n\n\n## Cartographie des modes de facturation\n\nNeuf flux, trois grilles et sept façons de découper une facture pour un même client : c'est le cœur du problème de passation.\n\n- AG 495 ; Process OTIS : Cas 2 (sans commande) ; Une facture par : Affaire, appareils listés ; N° de commande porté : Affaire + appareils ; Grille : Standard 2022 ; Minimum : Non ; Annexe : Sur demande\n- AG 496 ; Process OTIS : Cas 2 (sans commande) ; Une facture par : Affaire, appareils listés ; N° de commande porté : Affaire + appareils ; Grille : Standard 2022 ; Minimum : Non ; Annexe : Sur demande\n- AG 58 ; Process OTIS : Cas 1 (devis → OJ) ; Une facture par : Contremaître × type (Contrats / FHR) ; N° de commande porté : OJ OTIS ; Grille : Standard 2022 ; Minimum : Non ; Annexe : Non\n- CRA ; Process OTIS : Cas 2 (sans commande) ; Une facture par : BU (2 sur AG 496, 1 sur AG 495) ; N° de commande porté : N.A ; Grille : Standard 2022 ; Minimum : Non ; Annexe : Oui, Excel E/S + stockage\n- Tour Link ; Process OTIS : Cas 1 (devis → OJ) ; Une facture par : Mois ; N° de commande porté : OJ OTIS ; Grille : Tours 01/01/2023 ; Minimum : Non ; Annexe : Sur demande\n- Tour Triangle ; Process OTIS : Cas 1 (devis → OJ) ; Une facture par : Mois ; N° de commande porté : OJ OTIS ; Grille : Tours 01/01/2023 (titrée The Link) ; Minimum : Non ; Annexe : Sur demande\n- NSA ; Process OTIS : Cas 2 selon le process, OJ / ON / OH selon l'atelier ; Une facture par : Appareil + 1 facture Outillage ; N° de commande porté : N° reçu de C. Kirsch ; Grille : Standard 2022 ; Minimum : Aucun ; Annexe : Jamais\n- GDN ; Process OTIS : Non formalisé ; Une facture par : Demande (dossier client du mois) ; N° de commande porté : Affaire ou appareil ; Grille : Spécifique, non écrite ; Minimum : 60 € par demande ; Annexe : Non\n- OTIS FRANCE ; Process OTIS : Cas 1 (devis → OJ) ; Une facture par : Appareil ; N° de commande porté : OJ OTIS ; Grille : Standard 2022 (non précisé en atelier) ; Minimum : Non ; Annexe : Sur demande\n\nLes sept découpages : affaire, appareil, appareil + outillage, BU, contremaître × type, mois, demande. Trois entités seulement suivent le même modèle (AG 495, AG 496 et, à la commande près, OTIS FRANCE).\n\nContradiction à trancher : le document « Process de facturation OTIS » classe NSA en cas 2 (sans commande), alors que l'atelier NSA demande de porter un n° de commande OJ / ON / OH transmis par C. Kirsch.\n\n\n## Constats transverses\n\nLa facture se joue à la réception : tout ce qui n'est pas saisi proprement sur le BR est reconstitué à la main en fin de mois.\n\n- L'identification dépend de 6 interlocuteurs OTIS : Cindy (affaire et code contremaître AG 495 / 496), B. Brichet (GDN, 90 % des cas), C. Kirsch (NSA), S. Lagasse (OTIS FRANCE), les contremaîtres CRA et M. Rubio (fournisseurs internationaux, CRA / AG 496).\n- Le nom du contremaître et l'entité sont déduits à la main via Inventaire physique à partir du code.\n- CRA : sans contremaître, la marchandise reste en zone d'attente, sans existence dans Odoo ; le BR est créé après coup avec une « Force date » dont la prise en compte reste à vérifier.\n- Le champ « N° de commande » est un texte libre qui porte 6 natures d'information : appareil / affaire, appareil seul, commande interne OTIS (OH…), OJ, « Retour chantier », « EPC ». C'est la clé de facturation, et elle n'est pas contrôlée.\n- Règle de BR différente selon l'entité : 1 BR par appareil (AG 495, AG 496, OTIS FRANCE), 1 BR par livraison fournisseur (Tours).\n- Adresse chantier en « Saisie manuelle adresse », renseignée seulement si elle figure sur le BL.\n\n- Préparation partielle demandée en texte libre (« que la partie mécanique », « que les gueuses »).\n- Priorisation des préparations sur une feuille récapitulative imprimée par l'ADV.\n- Pas de procédure pour le reste à quai.\n\n- Devis global de contrôle, annulé puis éclaté à la main, chaque mois, pour toutes les grandes entités.\n- L'ADV scinde à la main le champ n° de commande en appareil et affaire avant de regrouper.\n- GDN : dossier papier (mail client, BR, BL), surfaces recalculées à la main depuis les dimensions du BR.\n- Trois intitulés d'objet coexistent (« Gestion E/S + Stockage », « Logistique », « Prestation logistique LEGAA »), avec des erreurs de mois (« FÉVRIER 2025 » pour février 2026, « JANVIER 2025 » pour janvier 2026) et de frappe.\n- Quatre régimes d'annexe : jamais, non, sur demande, systématique.\n- AG 58 : 106 devis sous 60 € en 12 mois (27 % des devis AG 58, 2 790 € HT au total). Autant de factures à éditer, envoyer et suivre pour un montant négligeable.\n- Cas 1 (AG 58, Tours, OTIS FRANCE) : la facture attend l'OJ ; aucun suivi des devis en attente de commande n'a été décrit en atelier.\n\n\n## Préconisations générales\n\nPosition : on ne simplifie pas la facturation en fin de mois, on la rend inutile à reconstituer. La donnée est qualifiée au BR, la plateforme calcule et découpe, l'ADV contrôle et édite.\n\n\n### 1. Trois modèles de facturation au lieu de neuf\n\n- A · Par chantier ; Règle : 1 facture par affaire (appareils listés) ; à défaut d'affaire, par appareil ; Entités : AG 495, AG 496, OTIS FRANCE, NSA (appareils) ; Changement par rapport à aujourd'hui : OTIS FRANCE et NSA passent de « par appareil » à « par affaire » quand l'affaire est connue\n- B · Par périmètre mensuel ; Règle : 1 facture par mois et par périmètre (BU, auxiliaire, contremaître), annexe ligne à ligne ; Entités : CRA (par BU), Tour Link, Tour Triangle, GDN, NSA (outillage) ; Changement par rapport à aujourd'hui : GDN abandonne la facture par demande au profit d'une facture mensuelle (déjà en discussion Etienne / Fethi)\n- C · Par contremaître × type ; Règle : 2 factures par contremaître (Contrats / FHR) ; Entités : AG 58 ; Changement par rapport à aujourd'hui : Inchangé sur le principe ; seuil minimum à négocier (point 7)\n\nLa plateforme porte déjà ces clés (« Une facture par » : affaire, appareil, contremaître, contremaître × Contrats / FHR, agence) : il reste à ajouter la clé BU pour CRA.\n\n\n### 2. Supprimer le devis de contrôle\n\nLe devis global annulé n'a plus de raison d'être : le calcul, l'éclatement et le contrôle sont faits dans la plateforme (onglets Factures et Contrôle factures). L'ADV ne crée dans Odoo que les devis finaux, à partir des pro forma. Gain : 99 devis en moins par an et plus aucune ressaisie d'éclatement.\n\n\n### 3. Un BR qualifié, bloquant à la validation\n\n- Champs obligatoires : client = entité de facturation (auxiliaire), code contremaître, type de flux (neuf, retour chantier, outillage, EPC).\n- Scinder « N° de commande » en deux champs structurés Appareil (8 caractères) et Affaire (8 caractères), plus la case « Retour chantier » proposée en atelier CRA. Fin du découpage manuel et des affaires tronquées.\n- Plus de zone d'attente hors système : réception immédiate sur un détenteur « OTIS – À identifier », réaffecté dès confirmation. Le stockage court du jour 1 sans « Force date », et la plateforme signale les colis non identifiés depuis plus de 5 jours.\n\n\n### 4. Un référentiel OTIS unique, alimenté par OTIS\n\n- Une table maintenue dans la plateforme : entités, BU, contremaîtres (code, nom, BU, agence), interlocuteurs, grille, règle de facturation.\n- Demander à OTIS une extraction mensuelle des affaires et appareils ouverts par agence (via Cindy pour AG 495 / 496), au lieu d'une demande par appareil.\n- Une grille = une entité Odoo (auxiliaire), comme pour les Tours depuis octobre 2026. Ne pas gérer plusieurs grilles dans une même entité : la règle doit rester lisible par l'ADV.\n\n\n### 5. Factures normalisées et justifiées\n\n- Objet généré : « LOGISTIQUE – <MOIS AAAA> – <clé> » (affaire, BU, TOUR LINK, CONTRATS / FHR, OUTILLAGE).\n- Mois de facturation obligatoire au format AAAA-MM.\n- Annexe ligne à ligne générée et archivée pour chaque facture ; envoyée d'office pour le modèle B, sur demande pour A et C.\n\n\n### 6. Suivi des commandes (cas 1)\n\nPour AG 58, les Tours et OTIS FRANCE, une liste des devis en attente d'OJ dans la plateforme, avec relance nominative à J+7 (C. Stelbel, N. Clément, S. Lagasse, contremaîtres AG 58).\n\n\n### 7. Contractualiser les écarts\n\nToute règle ou grille appliquée sans base écrite est un risque de litige : chaque écart est documenté par avenant ou mail de validation OTIS, puis paramétré dans la plateforme. Les points à contractualiser sont listés agence par agence dans la roadmap ci-dessous (GDN, Tours, AG 58, NSA, OTIS FRANCE). Un minimum de 60 € par facture pour AG 58 et NSA rapporterait +3,7 k€ HT/an au volume actuel, et surtout supprimerait 112 micro-factures.\n\n\n### 8. Préparation\n\nRemplacer la feuille récapitulative par le bon de préparation Odoo, et pour les préparations partielles envoyer au contremaître la liste des colis de l'appareil pour sélection (process cible défini en atelier AG 495 / 496). Procédure « reste à quai » à traiter dans un atelier dédié.\n\n\n## Roadmap générale\n\nTrois temps : ce que LEGAA fait seul tout de suite, ce qui touche Odoo, ce qui se négocie avec OTIS.\n\n- 1 · Nettoyer et transmettre ; Période proposée : Novembre 2026 ; Contenu : Rapprochements Tours et CRA (points 1 à 4), passation des books aux ADV, suppression des devis de contrôle, objet et mois de facturation normalisés, référentiel contremaîtres ; Dépend d'OTIS : Non\n- 2 · Qualifier à la source ; Période proposée : Décembre 2026 – janvier 2027 ; Contenu : Champs Appareil / Affaire / type de flux sur le BR, détenteur « OTIS – À identifier », clé BU et annexes automatiques dans la plateforme, suivi des devis en attente d'OJ ; Dépend d'OTIS : Non\n- 3 · Contractualiser ; Période proposée : Premier trimestre 2027 ; Contenu : Avenant GDN, extension grille Tours, minimum 60 €, facture mensuelle GDN et NSA, extraction mensuelle des affaires OTIS ; Dépend d'OTIS : Oui\n\n\n## Roadmap par agence\n\nChaque agence a ses actions, rangées dans les trois phases ci-dessus. Porteurs proposés : ADV = l'ADV qui reprend le compte ; « OTIS : oui » = l'action attend une réponse ou une signature d'OTIS.\n\n\n### AG 495\n\nObjectif : zéro demande unitaire à Cindy et zéro découpage manuel du n° de commande d'ici fin du 1er trimestre 2027.\n\n- 1 · Nov. 2026 ; Action : Passation du book à l'ADV ; fin du devis global de contrôle (11 annulés en 12 mois) ; Porteur : ADV, Fethi ; OTIS : Non\n- 1 · Nov. 2026 ; Action : Code contremaître sur chaque devis (1 affaire = 1 contremaître, base de la compta OTIS) ; objet « LOGISTIQUE – <MOIS AAAA> » ; Porteur : ADV ; OTIS : Non\n- 2 · Déc. – janv. ; Action : Champs Appareil et Affaire séparés sur le BR, contrôle du format 8 caractères ; Porteur : Fethi ; OTIS : Non\n- 2 · Déc. – janv. ; Action : Annexe ligne à ligne générée et archivée, envoyée sur demande ; Porteur : ADV ; OTIS : Non\n- 3 · T1 2027 ; Action : Extraction mensuelle OTIS des affaires, appareils et contremaîtres AG 495, importée dans la plateforme ; Porteur : Etienne Kieffer ; OTIS : Oui\n\n\n### AG 496\n\nObjectif : premier compte OTIS (485 k€ HT / an) facturé sans ressaisie, avec un export Odoo complet.\n\n- 1 · Nov. 2026 ; Action : Passation du book ; fin du devis global de co function kbText(name, buf){
  var ext = (String(name).split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return PDFCHECK.extractLines(buf).then(function(x){ return x.lines.join('\n'); });
  if (/^(xlsx|xls|xlsm|csv)$/.test(ext)) return Promise.resolve().then(function(){ var wb = XLSX.read(new Uint8Array(buf), { type:'array' });
    return wb.SheetNames.map(function(sn){ var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false, defval:'' }).slice(0, 400);
      return '## Feuille ' + sn + '\n' + rows.filter(function(r){ return r.some(function(c){ return String(c).trim(); }); }).map(function(r){ return r.map(function(c){ return String(c).trim(); }).filter(Boolean).join(' · '); }).join('\n'); }).join('\n\n'); });
  if (ext === 'docx') return Promise.resolve().then(function(){ var z = XLSX.CFB.read(new Uint8Array(buf), { type:'array' }), f = XLSX.CFB.find(z, 'word/document.xml');
    if (!f) throw new Error('document Word illisible'); var xml = new TextDecoder('utf-8').decode(f.content);
    return xml.replace(/<\/w:p>/g, '\n').replace(/<w:tab\/>/g, ' ').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'"); });
  if (/^(txt|md|csv|json|html?)$/.test(ext)) return Promise.resolve(new TextDecoder('utf-8').decode(new Uint8Array(buf)).replace(/<[^>]+>/g, ' '));
  return Promise.reject(new Error('format .' + ext + ' non lu'));
}

  h += L.length ? L.map(function(c){ var u = chatUnread(c); return '<button class="ch-c'+(u?' unread':'')+'" data-chopen="'+esc(c.id)+'"><span class="ch-ct">'+(c.group?'<span class="pill p-info">groupe</span> ':'')+esc(chatTitle(c))+'</span><span class="muted">'+(c.lastAt ? ago(c.lastAt) : '')+'</span><span class="ch-cl">'+(c.lastText ? esc((c.lastBy ? c.lastBy.split(' ')[0]+' : ' : '')+c.lastText) : '<i>Aucun message</i>')+'</span>'+(u?'<b class="ch-u"></b>':'')+'</button>'; }).join('') : '<span class="muted">Aucune discussion. Cliquer sur un collègue connecté pour lui écrire.</span>';
  h += '</div>';
  if (off.length) h += '<details class="ch-sec"><summary class="lbl">Hors ligne ('+off.length+')</summary>'+off.map(function(p){ return '<button class="ch-p" data-chdm="'+esc(p.uid)+'" data-nm="'+esc(p.name)+'"><i class="dot"></i><span>'+esc(p.name)+'</span><span class="muted">vu '+ago(p.at)+'</span></button>'; }).join('')+'</details>';
  box.innerHTML = h;
}
function renderMsgs(){
  var el = $('chmsgs'); if (!el) return; var me = myUid(), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = CH.msgs.length ? CH.msgs.map(function(m){ var mine = m.by === me; return '<div class="msg'+(mine?' me':'')+'">'+(mine?'':'<span class="mn">'+esc(m.name)+'</span>')+'<span class="mt">'+esc(m.text)+'</span><span class="mh">'+hm(m.at)+'</span></div>'; }).join('') : '<p class="muted" style="text-align:center">Aucun message. Écrivez le premier.</p>';
  if (atBottom || !el._init){ el.scrollTop = el.scrollHeight; el._init = true; }
}
function chatSend(){
  var ti = $('chinput'), t = ti && ti.value.trim(); if (!t || !CH.cur) return;
  ti.value = ''; STORE.sendMessage(CH.cur, t).catch(function(e){ toast('Message non envoyé : '+e.message); ti.value = t; });
}
document.addEventListener('keydown', function(e){ if (e.target && e.target.id === 'chinput' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); chatSend(); } });
function savDeepLink(){ var m = /#sav=([^&]+)/.exec(location.hash || ''); if (!m || !isExpert()) return; var id = decodeURIComponent(m[1]); ST.module = 'sav'; SAV.tab = id.charAt(0) === 'A' ? 'adv' : 'q'; SAV.mode = 'list'; SAV.hl = id;
  (SAV.list ? Promise.resolve() : savLoad()).then(function(){ var f = savById(id); if (f && f.set && SAV.tab === 'q') SAV.set = f.set; render(); setTimeout(function(){ var el = document.getElementById('sv-'+id); if (el){ el.scrollIntoView({ block:'center' }); el.classList.add('hl'); } }, 50); }); }
function start(profile){
  ST.user = profile; $('login').hidden = true; $('app').hidden = false; armIdle(); chatStart();
  STORE.getConfig().then(function(c){ ST.cfg = c ? deepMerge(E.DEFAULT_CONFIG, c) : clone(E.DEFAULT_CONFIG); if (c && c.agencies) Object.keys(E.DEFAULT_CONFIG.agencies).forEach(function(k){ if (!c.agencies[k]) delete ST.cfg.agencies[k]; });
    // Clause « minimum m² par appareil » abandonnée : désactivée une fois sur toutes les grilles
    var m30 = false; if (!ST.cfg.rules.min30Off){ ST.cfg.rules.min30 = false; Object.keys(ST.cfg.grids).forEach(function(g){ ST.cfg.grids[g].min30 = 0; }); ST.cfg.rules.min30Off = '2026-10'; m30 = true; }
    if (m30 && c && isAdmin()) STORE.saveConfig(ST.cfg, 'Minimum m² par appareil désactivé sur toutes les grilles (clause abandonnée)').catch(function(){});
    var ch = applyAgencyRules(ST.cfg); if (ch.length && c && isAdmin()) STORE.saveConfig(ST.cfg, 'Règles de facturation appliquées (AG 58 : Contrats / FHR par contremaître ; NSA : une facture par appareil ; CRA : une facture par BU) : '+ch.join(', ')).catch(function(){});
    ST.cfgM = ST.cfg; return STORE.listMonths(); })
    .then(function(L){ L = setMonthsIndex(L); var withData = L.filter(function(m){ return (m.files||[]).length; }).map(function(m){ return m.month; }).sort(); ST.month = withData.indexOf(defaultMonth()) >= 0 ? defaultMonth() : (withData[withData.length-1] || defaultMonth()); render(); loadTransports(); savLoad().then(savDeepLink); },
      function(e){ toast('Base de données inaccessible : '+e.message); });
}
STORE.onAuth(function(profile, msg){ if (profile) start(profile); else { ST.user = null; showLogin(msg); } });
if (window.claude && window.claude.use) window.claude.use('downloads').then(function(x){ dl = x; render(); }, function(){ dl = null; });
})();
