<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pilotage Logistique · LEGAA</title>
<!-- Version : v5.6 · 01/10/2026 — fichier unique ; seul config.js (configuration Firebase) reste séparé -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}

/* Layout : barre d'outils fixe + parcours en 5 étapes ; contenu dense en tableaux, gris/noir, couleur réservée aux statuts */
:root{
  --bg:#eef0f1; --surface:#ffffff; --sunk:#f6f7f8; --ink:#141618; --ink-2:#3b4046; --muted:#646b72; --line:#d6dadd; --line-2:#e6e9eb;
  --sel:#1d2024; --sel-ink:#ffffff; --hover:#f0f2f3; --bar:#1a1c1f; --bar-ink:#f2f3f4;
  --crit:#a8261b; --crit-bg:#fbeceb; --warn:#8a5a05; --warn-bg:#fbf3e3; --info:#4a5561; --info-bg:#eef1f4; --ok:#2f6b3a; --ok-bg:#e9f3eb;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-label:"Barlow Semi Condensed","Barlow",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#181b1e; --sunk:#1d2024; --ink:#e7e9ea; --ink-2:#c3c8cc; --muted:#8f979e; --line:#2e3338; --line-2:#252a2e;
  --sel:#e7e9ea; --sel-ink:#111315; --hover:#202428; --bar:#0a0b0c; --bar-ink:#e7e9ea;
  --crit:#f0877c; --crit-bg:#34191a; --warn:#e6b35c; --warn-bg:#2f2512; --info:#a9b4bf; --info-bg:#1f252b; --ok:#8fcf99; --ok-bg:#16271a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#181b1e; --sunk:#1d2024; --ink:#e7e9ea; --ink-2:#c3c8cc; --muted:#8f979e; --line:#2e3338; --line-2:#252a2e;
  --sel:#e7e9ea; --sel-ink:#111315; --hover:#202428; --bar:#0a0b0c; --bar-ink:#e7e9ea;
  --crit:#f0877c; --crit-bg:#34191a; --warn:#e6b35c; --warn-bg:#2f2512; --info:#a9b4bf; --info-bg:#1f252b; --ok:#8fcf99; --ok-bg:#16271a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px}
td.n,th.n{text-align:right;white-space:nowrap}
h1,h2,h3{font-family:var(--f-label);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:18px} h3{font-size:15px}
.lbl{font-family:var(--f-label);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-family:var(--f-label);font-size:12px;opacity:.7;letter-spacing:.05em}
.period{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:13px}
.period select{background:transparent;color:inherit;border:1px solid currentColor;border-radius:2px;padding:3px 6px}
.period select option{color:#141618}
.tabs{display:flex;gap:0;overflow-x:auto;max-width:1500px;margin:0 auto;padding:0 16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:inherit;opacity:.72;padding:8px 14px 7px;font-family:var(--f-label);font-size:14px;font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab b{font-family:var(--f-num);font-weight:400;font-size:11px;opacity:.8}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:currentColor}
.tab .cnt{font-family:var(--f-num);font-size:11px;padding:0 5px;border-radius:2px;background:var(--crit);color:#fff}

main{max-width:1500px;margin:0 auto;padding-block:18px 60px;padding-inline:16px}
section.view{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.ph .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pb{padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:2px;font-family:var(--f-label);font-weight:500;font-size:13.5px;letter-spacing:.02em}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--ink-2);max-width:78ch}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-family:var(--f-label);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:13px}
.detail td{font-size:12.5px;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)}
tr.open td{background:var(--sunk)}
tr.excl td{opacity:.42}
tr.excl td:first-child{opacity:1}
tr.sub td{font-family:var(--f-label);font-weight:600;background:var(--sunk);font-size:13px;letter-spacing:.02em}
tr.tot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
.detail{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:2px}
.detail th{position:sticky;top:0;z-index:1}
.prod{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formula{font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);white-space:nowrap}

.pill{display:inline-block;font-family:var(--f-label);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:2px;white-space:nowrap}
.p-bloquant{background:var(--crit-bg);color:var(--crit)} .p-verifier{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--info-bg);color:var(--info)} .p-ok{background:var(--ok-bg);color:var(--ok)}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle}
.f-bloquant{background:var(--crit)} .f-verifier{background:var(--warn)} .f-info{background:var(--info)}

/* Import */
.drop{border:1.5px dashed var(--muted);border-radius:3px;padding:26px 16px;text-align:center;background:var(--sunk);display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--ink);background:var(--hover)}
.drop input{display:none}

/* Anomalies */
.anom{border-bottom:1px solid var(--line-2)}
.anom:last-child{border-bottom:0}
.anom-h{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px 14px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.anom-h:hover{background:var(--hover)}
.anom-h .t{font-weight:600}
.anom-h .e{grid-column:2/4;font-size:13px;color:var(--ink-2);max-width:95ch}
.anom-b{padding:0 14px 14px}

/* Factures */
.fx{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.fx{grid-template-columns:minmax(0,1fr)}}
.ilist{display:grid}
.iitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;width:100%}
.iitem:hover{background:var(--hover)}
.iitem[aria-current="true"]{background:var(--sel);color:var(--sel-ink)}
.iitem[aria-current="true"] .muted{color:inherit;opacity:.7}
.iitem .n{font-family:var(--f-num);font-size:12.5px;text-align:right}
.iag{padding:8px 12px 5px;background:var(--sunk);border-bottom:1px solid var(--line-2)}
.subnav{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;background:var(--line);gap:1px;overflow:hidden}
.subtab{flex:1 1 220px;display:grid;gap:2px;text-align:left;padding:10px 14px;border:0;background:var(--surface);border-bottom:3px solid transparent}
.subtab:hover{background:var(--hover)}
.subtab[aria-selected="true"]{background:var(--sel);color:var(--sel-ink)}
.subtab .st-l{font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.02em}
.subtab .st-v{font-size:14px}
.subtab .st-s{font-size:12px;opacity:.7}
.invt tbody.inv{border-top:2px solid var(--line)}
.invt tbody.inv tr.first td{border-top:1px solid var(--line)}
.invt td.ihead{vertical-align:top;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.invt .inum{font-size:12.5px;white-space:nowrap}
.invt .aps{font-size:11.5px;display:inline-block;max-width:340px;white-space:normal}
.invt tr.zero td:not(.ihead){color:var(--muted)}
.invt tbody.done tr:not(.det) td{opacity:.62}
.invt tr.det > td{padding:10px 8px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.det-w{width:0;min-width:100%}
.det-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.invt tr.tot td{border-top:1px solid var(--line);font-family:var(--f-label);font-size:13px}
.invt tr.tot td.n{font-family:var(--f-num)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.doc-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px;padding:18px 20px;border-bottom:2px solid var(--ink)}
.doc-h .big{font-family:var(--f-label);font-size:22px;font-weight:600;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.doc-b{padding:16px 20px;display:grid;gap:16px}
.totbox{justify-self:end;min-width:min(320px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 24px;font-size:14px}
.totbox .n{font-family:var(--f-num);text-align:right}
.totbox .g{border-top:1px solid var(--ink);padding-top:4px;font-weight:600}
.cmp{font-size:12.5px}
.delta-pos{color:var(--ok)} .delta-neg{color:var(--crit)}

/* Forms */
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px}
.fld{display:grid;gap:4px}
.fld input,.fld select{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 8px;width:100%}
.fld input[type=number]{font-family:var(--f-num)}
.chk{display:flex;gap:8px;align-items:center}
.tbl-in input{width:92px;border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:3px 6px;font-family:var(--f-num);text-align:right}
.rules{display:grid;gap:10px;max-width:92ch}
.rules ol{margin:0;padding-left:20px;display:grid;gap:8px}
.rules code{font-family:var(--f-num);font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:16px;align-items:start}
.reco{border:2px solid var(--ink);border-radius:3px;padding:14px;display:grid;gap:8px}
.reco .price{font-family:var(--f-num);font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--sel-ink);padding:8px 14px;border-radius:2px;font-size:13px;z-index:50}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.iitem{transition:background .12s,border-color .12s}}

/* ---- v2 : période, connexion, synthèse, contrôle PDF, administration ---- */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.strip strong{font-family:var(--f-label);font-size:16px;letter-spacing:.02em}
.strip .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input,.row select,.pb select,.pb input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:5px 8px}
.warnbox{border-color:var(--warn);display:grid;gap:10px}
.warnbox p{margin:0}
.who{background:none;border:1px solid currentColor;color:inherit;border-radius:2px;padding:3px 8px;font-family:var(--f-label);font-size:13px;opacity:.85}
.who:hover{opacity:1}
.tab .cnt.w{background:var(--warn)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.chart{margin:0;background:var(--surface);padding:12px 12px 6px;display:grid;gap:4px;min-width:0}
.chart figcaption .t{font-family:var(--f-label);font-weight:600;font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-num);font-size:9.5px}
.chart .bar{fill:var(--muted)}
.chart .bar.cur{fill:var(--ink)}
.chart .bar:hover{fill:var(--ink-2);cursor:default}
#ctip{position:fixed;z-index:60;background:var(--sel);color:var(--sel-ink);font-size:12px;padding:5px 8px;border-radius:2px;pointer-events:none;max-width:340px}
table.syn th.grp{text-align:center;border-bottom:1px solid var(--line)}
table.syn td,table.syn th{white-space:nowrap}
pre.pdftxt{font-family:var(--f-num);font-size:11.5px;background:var(--surface);border:1px solid var(--line);padding:10px;max-height:320px;overflow:auto;white-space:pre-wrap}
details summary{cursor:pointer;padding:6px 0}
details.miss{padding:0 2px}
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:3px}
.login-card .hd{background:var(--bar);color:var(--bar-ink);padding:16px 20px;display:grid;gap:2px}
.login-card .hd h1{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.login-card form{padding:20px;display:grid;gap:14px}
.login-card .msg{min-height:1.2em;font-size:13px;color:var(--crit)}
.demo-banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:6px 16px;text-align:center}
.fld .row input{flex:1;min-width:0}

/* ---- v3 : accueil, arborescence agence > mois, factures, fenêtre de détail ---- */
.brand{background:none;border:0;color:inherit;padding:0;display:flex;align-items:baseline;gap:10px;margin-right:0;cursor:pointer;text-align:left}
.modname{font-family:var(--f-label);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-left:14px;border-left:1px solid currentColor;opacity:.9}
.landing{max-width:980px;margin:6vh auto 0;display:grid;gap:14px}
.landing h2{font-size:24px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.choice{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:28px 24px;cursor:pointer;border-top:4px solid var(--ink)}
.choice:hover{background:var(--hover)}
.choice .k{font-family:var(--f-label);font-size:26px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.choice .d{color:var(--ink-2);max-width:52ch}
.choice .m{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.lay{display:grid;grid-template-columns:minmax(200px,240px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}}
.mtree{display:grid;align-content:start}
.mitem{display:grid;gap:1px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:8px 12px;cursor:pointer}
.mitem:hover{background:var(--hover)}
.mitem[aria-current="true"]{background:var(--sel);color:var(--sel-ink)}
.mitem .mst{font-size:12px;opacity:.75}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--line)}
.d-ouvert{background:var(--warn)} .d-clos{background:var(--ok)}
.mpanel{display:grid;gap:14px;min-width:0}
.subtabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--line)}
.stb{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 16px;font-family:var(--f-label);font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.stb[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.stb .cnt{font-family:var(--f-num);font-size:11px;padding:0 5px;border-radius:2px;background:var(--crit);color:#fff}
.stb .cnt.w{background:var(--warn)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
dl.kv{margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.toolbar .sp{margin-left:auto}
table.invt2 td{vertical-align:middle}
table.invt2 td.c,table.invt2 th.c{text-align:center}
table.invt2 .aps{font-size:11.5px;display:inline-block;max-width:420px;white-space:normal}
table.invt2 tfoot td{font-weight:600;border-top:2px solid var(--ink)}
.amt{background:none;border:0;border-bottom:1px dashed var(--muted);padding:2px 0;font-family:var(--f-num);font-size:13px;color:var(--ink);cursor:pointer}
.amt:hover{border-bottom-color:var(--ink);background:var(--hover)}
.xn{font-size:10.5px;color:var(--warn);margin-left:4px}
.stsel{border:1px solid var(--line);border-radius:2px;padding:3px 6px;background:var(--surface);font-family:var(--f-label);font-weight:600;font-size:12.5px}
.stsel.s-verifier{color:var(--warn);background:var(--warn-bg)} .stsel.s-editer{color:var(--info);background:var(--info-bg)} .stsel.s-editee{color:var(--ok);background:var(--ok-bg)}
.gear{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:4px 7px;color:var(--ink-2);font-family:var(--f-label);font-size:12px;cursor:pointer}
.gear:hover{background:var(--hover);color:var(--ink)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.55);display:grid;place-items:center;padding:24px 16px}
#modal[hidden]{display:none}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:3px;width:min(1280px,100%);max-height:calc(100vh - 48px);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;padding:16px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mbody{overflow:auto;min-height:0}
.mbody .detail{max-height:none}
body.noscroll{overflow:hidden}
.ctlhead{display:grid;gap:10px}
.verdict{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 16px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.verdict strong{font-family:var(--f-label);font-size:18px}
.v-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)} .v-ko{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.closebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:1px;background:var(--line-2)}
.docslot{background:var(--surface);padding:14px;display:grid;gap:6px;align-content:start}
.hint{font-size:12px;color:var(--muted)}
.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 8px;width:100%;font:inherit;color:inherit;resize:vertical}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled,.tbl-in input:disabled{background:var(--sunk);color:var(--ink-2)}
details > summary.ph{list-style:none;cursor:pointer}
.fld{align-content:start}
.docslot .btn,.docslot .row{justify-self:start}
.mpanel{grid-template-columns:minmax(0,1fr)}
@media (max-width:600px){.toolbar .sp{margin-left:0}.stb{padding:8px 10px}}
@media (max-width:860px){.mtree{display:flex;overflow-x:auto}.mtree .ph{display:none}.mtree .mitem{flex:0 0 auto;min-width:130px;border-bottom:0;border-right:1px solid var(--line-2)}.mtree .pb{flex:0 0 auto}}


/* ---- v3.1 : Paramètres sur une colonne, sélecteur de période ---- */
.onecol{max-width:900px;margin-inline:auto}
.col-f{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.col-f .fld{max-width:620px}
.docs1{grid-template-columns:minmax(0,1fr)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.bigsel{border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:2px;padding:6px 10px;font-family:var(--f-label);font-weight:600;font-size:14.5px;min-width:0;max-width:100%}
.persel{display:inline-flex;align-items:center;gap:4px}
.persel .btn{font-size:16px;line-height:1;padding:5px 9px}

/* ---- v3.2 : principes, complétude, colonnes factures ---- */
.princ{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:8px}
.princ dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:6px 20px}
.princ dl div{display:grid;gap:1px}
.princ dt{font-size:11.5px;color:var(--muted)}
.princ dd{margin:0;font-size:13.5px}
.kpi .bar{display:block;height:4px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-top:4px}
.kpi .bar i{display:block;height:100%;background:var(--ink)}
table.invt2 td{vertical-align:top}
table.invt2 td.n,table.invt2 td.c{vertical-align:middle}
table.invt2 td.apcol{font-size:12px;white-space:nowrap}
table.invt2 td:nth-child(9){vertical-align:middle}
.princ dl div{align-content:start}

/* ---- v3.3 : principes compacts, picto grille, fenêtre grille ---- */
.princ-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gridbtn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.gridbtn:hover{border-color:var(--ink)}
.princ dl{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.mbox.mbox-s{width:min(640px,100%);grid-template-rows:auto minmax(0,1fr)}

/* ---- v3.4 : contrôle factures (Delta, Check, aperçu PDF) ---- */
.dko{color:var(--bad,#b3261e);font-weight:600}
table.ctlt td{vertical-align:middle}
td.pdfl{white-space:nowrap}
.lnk{background:none;border:0;padding:0 8px 0 0;font:inherit;font-size:12.5px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--muted)}
tr.nopdf td{color:var(--muted)}
tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
select.chk{font:inherit;font-size:12.5px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
select.chk-ok{border-color:#2e7d32}
select.chk-anomalie{border-color:#b3261e}
select.chk-encours{border-color:#8a6d1a}
.mbox.mbox-pdf{width:min(1000px,100%);height:calc(100vh - 48px);grid-template-rows:auto minmax(0,1fr)}
iframe.pdfv{width:100%;height:100%;border:1px solid var(--line);background:#fff}
.mhead a.btn{color:var(--ink);text-decoration:none}
/* ---- v3.5 : lien contrôle → facture ---- */
tr.hl td{background:#e9ebed;box-shadow:inset 0 1px 0 var(--ink),inset 0 -1px 0 var(--ink)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--ink),inset 0 1px 0 var(--ink),inset 0 -1px 0 var(--ink)}
.lnk.num{font-family:var(--f-num);padding:0}
/* ---- v3.6 : filtres du tableau des factures ---- */
tr.frow th{padding-top:4px;padding-bottom:6px;font-weight:400;text-transform:none;letter-spacing:0;vertical-align:top}
select.fsel{width:100%;max-width:190px;font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
select.fsel.on{border-color:var(--ink);font-weight:600}
.toolbar .sp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* ---- v3.7 : menu agences (sandwich), filtres multi-valeurs ---- */
.agwrap{position:relative;display:inline-flex}
.agbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:3px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.agbtn strong{font-weight:600;white-space:nowrap}
.agbtn .caret{font-size:11px;opacity:.7}
.agbtn:hover{background:#2b2f33}
.agpop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:260px;background:var(--bg);border:1px solid var(--ink);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:6px;display:grid;gap:2px}
.agpop .lbl{padding:4px 8px}
.agitem{text-align:left;background:none;border:0;border-radius:2px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.agitem:hover{background:var(--sunk)}
.agitem.cur{background:var(--ink);color:#fff;font-weight:600}
.mfilt{position:relative}
.fbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;max-width:200px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.fbtn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn.on{border-color:var(--ink);font-weight:600}
.fbtn .caret{font-size:10px;opacity:.6}
.fpop{z-index:40;background:var(--bg);border:1px solid var(--ink);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:8px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;text-transform:none;letter-spacing:0;font-weight:400}
.fpop .fq{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;width:100%;box-sizing:border-box}
.fpop-h{display:flex;justify-content:space-between}
.fpop-l{overflow:auto;max-height:280px;display:grid;gap:1px}
.fpop-l label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 4px;border-radius:2px;cursor:pointer;color:var(--ink)}
.fpop-l label[hidden]{display:none}
.fpop-l label:hover{background:var(--sunk)}
/* ---- v3.8 : défilement horizontal dans les fenêtres de détail ---- */
.mbox{grid-template-columns:minmax(0,1fr)}
.mbox>*{min-width:0}
.mbody .detail{overflow:visible;border:0}
.mbody{border:1px solid var(--line);border-radius:2px}

/* ==== v4 : palette bleu marine + accents, UX ==== */
:root{
  --bg:#edf1f5; --line:#d3dae2; --line-2:#e3e8ee; --hover:#eef3f9;
  --acc:#1f5fa6; --acc-d:#16467d; --acc-ink:#ffffff; --acc-bg:#e8f0fa; --acc-line:#b9cfe9;
  --sel:#1f5fa6; --sel-ink:#ffffff; --bar:#0f2a4d; --bar-ink:#eef3fa;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --line:#2a333d; --line-2:#222a33; --hover:#1a222c;
  --acc:#6fa8ee; --acc-d:#9cc4f4; --acc-ink:#0b1422; --acc-bg:#162536; --acc-line:#2c4a6e;
  --sel:#6fa8ee; --sel-ink:#0b1422; --bar:#0b1d36; --bar-ink:#e6eef8}}
:root[data-theme="dark"]{
  --bg:#0f141a; --line:#2a333d; --line-2:#222a33; --hover:#1a222c;
  --acc:#6fa8ee; --acc-d:#9cc4f4; --acc-ink:#0b1422; --acc-bg:#162536; --acc-line:#2c4a6e;
  --sel:#6fa8ee; --sel-ink:#0b1422; --bar:#0b1d36; --bar-ink:#e6eef8}
.top{border-bottom:0;box-shadow:0 2px 10px rgba(15,42,77,.18)}
.tab[aria-selected="true"]{border-bottom-color:#7fb2ee}
:focus-visible{outline-color:var(--acc)}
.btn{border-radius:4px}
.btn.pri:hover{background:var(--acc-d);border-color:var(--acc-d)}
.panel,.kpis,.charts{border-radius:6px}
.kpis{box-shadow:0 1px 2px rgba(15,42,77,.05)}
.kpi .bar i{background:var(--acc)}
.stb[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.stb:hover{color:var(--ink)}
.agbtn{background:var(--acc);border-color:var(--acc);border-radius:4px}
.agbtn:hover{background:var(--acc-d)}
.agpop{border-color:var(--acc-line);border-radius:6px}
.agitem.cur{background:var(--acc);color:var(--acc-ink)}
.agitem:hover{background:var(--acc-bg)}
tr.hl td{background:var(--acc-bg);box-shadow:inset 0 1px 0 var(--acc),inset 0 -1px 0 var(--acc)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--acc),inset 0 1px 0 var(--acc),inset 0 -1px 0 var(--acc)}
.fbtn.on,select.fsel.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.fpop{border-color:var(--acc-line);border-radius:6px}
.lnk{color:var(--acc)}
.amt{color:var(--acc)}
.gridbtn:hover{border-color:var(--acc);color:var(--acc)}
.princ{background:var(--acc-bg);border-color:var(--acc-line);border-radius:6px}
.chart .bar{fill:#9db8d6}
.chart .bar.cur{fill:var(--acc)}
.chart .bar:hover{fill:var(--acc-d)}

/* Accueil : deux blocs */
.landing{max-width:900px;margin:9vh auto 0;gap:22px;text-align:center}
.landing h2{font-size:26px}
.choices{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:22px}
.choice{justify-items:center;text-align:center;gap:14px;padding:44px 24px 34px;border:1px solid var(--line);border-top:0;border-radius:10px;box-shadow:0 2px 6px rgba(15,42,77,.07);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.choice::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acc)}
.choice.c-trp::before{background:#2f8f83}
.choice .ico{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;background:var(--acc-bg);color:var(--acc)}
.choice.c-trp .ico{background:#e4f3f1;color:#2f8f83}
.choice .k{font-size:28px}
.choice .go{font-family:var(--f-label);font-size:14px;font-weight:600;color:var(--acc);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.choice.c-trp .go{color:#2f8f83}
.choice:hover,.choice:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,42,77,.14);border-color:var(--acc-line);background:var(--surface)}
.choice:hover .go,.choice:focus-visible .go{opacity:1;transform:none}
.adm-l{margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .choice.c-trp .ico{background:#14302c;color:#6cc7b9}}
@media (prefers-reduced-motion: reduce){.choice,.choice .go{transition:none}}

/* Paramètres : les 3 documents principaux */
.keydocs{border:2px solid var(--acc);box-shadow:0 2px 10px rgba(31,95,166,.10)}
.keydocs>.ph{background:var(--acc-bg);border-bottom-color:var(--acc-line);border-radius:4px 4px 0 0}
.keydocs>.ph h2{color:var(--acc-d)}
.kd-n{font-family:var(--f-num);font-size:12px;padding:2px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.kd-n.ok{background:var(--ok-bg);color:var(--ok)}
.keydocs .docs{gap:12px;background:none;padding:14px}
.keydocs .docslot{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:6px;padding:14px 16px;gap:8px}
.keydocs .docslot.done{border-left-color:var(--ok)}
.ds-h{display:flex;align-items:center;gap:10px}
.ds-n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-family:var(--f-num);font-size:13px;font-weight:600;flex:none}
.ds-t{font-family:var(--f-label);font-weight:600;font-size:16px}
.ds-s{margin-left:auto;font-family:var(--f-label);font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.docslot.done .ds-s{background:var(--ok-bg);color:var(--ok)}

/* Synthèse : sélection multiple d'agences */
.chipbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 14px;font-family:var(--f-label);font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* ---- v4.1 : journal des anomalies coloré ---- */
.anom-hd,.anom-h{display:grid;grid-template-columns:110px minmax(180px,1.1fr) 70px minmax(220px,1.6fr) minmax(220px,1.6fr);gap:4px 14px;align-items:start}
.anom-hd{padding:8px 14px;font-family:var(--f-label);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line)}
.anom-hd .n,.anom-h .n{text-align:right}
.anom-h .e{grid-column:auto;font-size:13px;color:var(--ink-2)}
.anom-h .do{font-size:13px;color:var(--ink);font-weight:500}
.anom{border-left:5px solid transparent}
.anom.sv-bloquant{background:#fdecea;border-left-color:#c62f22}
.anom.sv-verifier{background:#fff7d6;border-left-color:#e0b400}
.anom.sv-info{background:#f1f3f5;border-left-color:#a3acb6}
.anom .anom-h:hover{background:rgba(0,0,0,.035)}
.anom-b{background:var(--surface);padding-top:10px}
.pill.p-verifier{background:#ffe9a3;color:#5e4700}
.pill.p-bloquant{background:#c62f22;color:#fff}
.pill.p-info{background:#dfe3e8;color:#3e4852}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-left:8px}
.lg-b{background:#c62f22}.lg-v{background:#e0b400}.lg-i{background:#a3acb6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .anom.sv-bloquant{background:#2e1715}:root:not([data-theme="light"]) .anom.sv-verifier{background:#2c2610}:root:not([data-theme="light"]) .anom.sv-info{background:#1b2027}}
@media (max-width:820px){.anom-hd{display:none}.anom-h{grid-template-columns:auto 1fr auto}.anom-h .e,.anom-h .do{grid-column:1/-1}}
/* ---- v4.2 : lignes de factures condensées ---- */
table.invt2 td.cc{white-space:nowrap}
table.invt2 td.cc .c1{display:inline-block;max-width:170px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.more{border:1px solid var(--acc-line);background:var(--acc-bg);color:var(--acc);border-radius:10px;padding:0 7px;font-family:var(--f-num);font-size:11px;line-height:17px;cursor:pointer;margin-left:2px}
.more:hover{background:var(--acc);color:var(--acc-ink)}
table.invt2 td{vertical-align:middle}
/* ---- v4.3 : récapitulatif du contrôle (condensé) ---- */
table.ctlt tr.recap td{background:var(--acc-bg);border-bottom:2px solid var(--acc);padding-top:5px;padding-bottom:5px;font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
table.ctlt tr.recap td:first-child{font-family:var(--f-label);color:var(--acc-d)}

/* ---- v4.4 : discussion ---- */
.chatbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:4px 10px;font-family:var(--f-label);font-size:13px;position:relative}
.chatbtn:hover{background:rgba(255,255,255,.18)}
.chatbtn b{background:#e5484d;color:#fff;font-family:var(--f-num);font-size:11px;border-radius:9px;padding:0 6px;line-height:17px}
.chat{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(380px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(15,42,77,.16);display:flex;flex-direction:column}
.ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--bar);color:var(--bar-ink)}
.ch-h .lnk{color:#cfe0f5}
.ch-h .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.ch-sec{display:grid;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line-2);overflow:auto}
.ch-row{display:flex;justify-content:space-between;align-items:center}
.ch-p,.ch-c{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink);position:relative}
.ch-p:hover,.ch-c:hover{background:var(--acc-bg)}
.ch-p .muted{font-size:11.5px}
.ch-c{grid-template-columns:1fr auto}
.ch-c .ch-ct{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-c .ch-cl{grid-column:1/-1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-c.unread .ch-ct,.ch-c.unread .ch-cl{color:var(--ink);font-weight:700}
.ch-u{position:absolute;right:8px;bottom:9px;width:9px;height:9px;border-radius:50%;background:#e5484d}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aab3bd}
.dot.on{background:#2fa84f;box-shadow:0 0 0 3px rgba(47,168,79,.18)}
.ch-t{display:grid;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.ch-t .muted{font-size:12px}
.ch-msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:82%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:6px 10px;display:grid;gap:2px}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);border-radius:10px 10px 2px 10px}
.msg .mn{font-size:11.5px;font-weight:600;color:var(--acc)}
.msg .mt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mh{font-size:10.5px;opacity:.7;justify-self:end;font-family:var(--f-num)}
.ch-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ch-in textarea{flex:1;resize:none;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ch-pick{display:grid;gap:4px;margin:6px 0 10px}
.ch-pick label{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer}
#chtitle{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px}
@media (max-width:640px){.chatbtn span{display:none}}
/* ---- v4.5 : suivi des anomalies, agences sans données en synthèse ---- */
table.suit tr.sv-bloquant td:first-child{box-shadow:inset 4px 0 0 #c62f22}
table.suit tr.sv-verifier td:first-child{box-shadow:inset 4px 0 0 #e0b400}
table.suit tr.sv-info td:first-child{box-shadow:inset 4px 0 0 #a3acb6}
table.suit tr.sv-bloquant td.hit{background:#fdecea}
table.suit tr.sv-verifier td.hit{background:#fff7d6}
table.suit tr.sv-info td.hit{background:#f1f3f5}
table.suit th.n{white-space:normal;min-width:70px;max-width:120px;vertical-align:bottom}
.wv{color:#8a6a00;font-weight:600}
.chip.off{opacity:.5;cursor:default;border-style:dashed}
.chip.off:hover{border-color:var(--line);color:var(--ink-2)}

.subtabs .stb:hover{border-color:#14233d}

/* ---- v6.6 : sélection de la période mise en avant ---- */
.perstrip{background:#fff;border:1.5px solid #cfd6e0;border-radius:6px;padding:14px 18px;gap:12px 18px;box-shadow:0 1px 2px rgba(20,35,61,.06)}

.perstrip .persel{display:inline-flex;align-items:center;gap:8px}
.perstrip .persel .btn{width:44px;height:44px;padding:0;font-size:22px;line-height:1;border:1.5px solid #14233d;color:#14233d;background:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.perstrip .persel .btn:hover:not([disabled]){background:#14233d;color:#fff}
.perstrip .persel .btn[disabled]{opacity:.35}
.perstrip #persel{height:44px;min-width:230px;font-size:19px;font-weight:700;color:#fff;background:#14233d;border:1.5px solid #14233d;border-radius:6px;padding:0 14px;cursor:pointer}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!--STORE_SCRIPTS-->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ==== store-firebase.js ==== */
/* ==== STOCKAGE PRODUCTION — Firebase Auth + Firestore uniquement (offre Spark possible) ====
   Site statique (GitHub Pages) : ni Cloud Storage, ni Cloud Functions, ni CLI.
   Firestore :
     config/global · config/purge
     users/{uid} · invites/{email}
     months/{AGENCE}_{AAAA-MM}  (+ pdfs/{id}, files/{id}/chunks/{n})
     agencyFiles/{id}/chunks/{n}
     transports/{id} · logs/{id}
   Les fichiers (exports Odoo, PDF, documents d'agence) sont conservés à l'identique, découpés en blocs
   binaires de 900 Ko, avec leur empreinte SHA-256 : on peut prouver quel fichier a servi au calcul. */
var STORE = (function () {
  'use strict';
  var CHUNK = 900000;            // < 1 Mio par document Firestore
  var RETENTION_MONTHS = 18;
  var LOG_RETENTION_DAYS = 550;  // règle Firestore : suppression autorisée au-delà de 548 j
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth = firebase.auth(), db = firebase.firestore();
  var FV = firebase.firestore.FieldValue, TS = FV.serverTimestamp, FBlob = firebase.firestore.Blob;
  var profile = null, loginPending = false, ipP = null, denyMsg = null;

  function tsToIso(t) { return t && t.toDate ? t.toDate().toISOString() : (t || null); }
  function clean(o) { return JSON.parse(JSON.stringify(o)); }
  function newId() { return Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
  function lower(s) { return String(s || '').trim().toLowerCase(); }

  /* ---- Journal (écrit par le navigateur ; règles : création seule, horodatage serveur imposé, jamais modifiable) ---- */
  function myIp() {
    if (!ipP) ipP = Promise.race([
      fetch('https://api.ipify.org?format=json').then(function (r) { return r.json(); }).then(function (j) { return String(j.ip || ''); }),
      new Promise(function (res) { setTimeout(function () { res(''); }, 3000); })
    ]).catch(function () { return ''; });
    return ipP;
  }
  function log(type, detail, month) {
    var u = auth.currentUser; if (!u) return Promise.resolve();
    return myIp().then(function (ip) {
      return db.collection('logs').add({
        at: TS(), uid: u.uid, email: u.email || null, type: String(type),
        detail: String(detail || '').slice(0, 480),
        month: typeof month === 'string' && /^[0-9A-Za-z_-]{1,13}_\d{4}-\d{2}$/.test(month) ? month : null,
        ip: ip.slice(0, 64), ua: String(navigator.userAgent || '').slice(0, 200)
      });
    }).catch(function () {});
  }
  function listLogs(limit) {
    return db.collection('logs').orderBy('at', 'desc').limit(limit || 500).get().then(function (q) {
      return q.docs.map(function (d) { var x = d.data(); x.id = d.id; x.at = tsToIso(x.at); return x; });
    });
  }

  /* ---- Fichiers en blocs binaires ---- */
  function sha256(buf) {
    return crypto.subtle.digest('SHA-256', buf).then(function (h) {
      return Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  // Écrit le fichier sous docPath (blocs puis document descriptif) et renvoie la fiche
  function putBlob(docPath, file, extra) {
    return file.arrayBuffer().then(function (buf) {
      return sha256(buf).then(function (hash) {
        var u8 = new Uint8Array(buf), n = Math.max(1, Math.ceil(u8.length / CHUNK)), chain = Promise.resolve();
        for (var i = 0; i < n; i++) (function (i) {
          chain = chain.then(function () {
            return db.doc(docPath + '/chunks/' + String(i).padStart(4, '0')).set({ i: i, b: FBlob.fromUint8Array(u8.subarray(i * CHUNK, (i + 1) * CHUNK)) });
          });
        })(i);
        var meta = Object.assign({ name: file.name, path: docPath, size: file.size, type: file.type || '', sha256: hash, chunks: n, at: new Date().toISOString(), by: profile.email }, extra || {});
        return chain.then(function () { return db.doc(docPath).set(meta); }).then(function () { return meta; });
      });
    });
  }
  function getFileBytes(meta) {
    return db.collection(meta.path + '/chunks').orderBy('i').get().then(function (q) {
      if (meta.chunks && q.size !== meta.chunks) throw new Error('Fichier incomplet en base (' + q.size + ' / ' + meta.chunks + ' blocs) : ' + meta.name);
      var parts = q.docs.map(function (d) { return d.data().b.toUint8Array(); });
      var len = parts.reduce(function (s, p) { return s + p.length; }, 0), out = new Uint8Array(len), o = 0;
      parts.forEach(function (p) { out.set(p, o); o += p.length; });
      return out.buffer;
    });
  }
  function deleteFile(meta) {
    if (!meta || !meta.path) return Promise.resolve();
    return db.collection(meta.path + '/chunks').get().then(function (q) {
      return Promise.all(q.docs.map(function (d) { return d.ref.delete(); }));
    }).then(function () { return db.doc(meta.path).delete(); }).catch(function () {});
  }

  /* ---- Authentification ---- */
  // Premier accès d'un compte créé dans la console : activé avec le rôle de son invitation, sinon mis en attente.
  function ensureProfile(u) {
    var ref = db.doc('users/' + u.uid);
    return ref.get().then(function (d) {
      if (d.exists) return d;
      var em = lower(u.email), inv = db.doc('invites/' + em);
      return inv.get().then(function (i) {
        var doc = i.exists
          ? { email: em, name: i.data().name || em, role: i.data().role, active: true, createdAt: TS(), createdBy: i.data().by || 'invitation', lastLogin: null }
          : { email: em, name: em, role: 'lecture', active: false, pending: true, createdAt: TS(), createdBy: 'premier accès', lastLogin: null };
        return ref.set(doc).then(function () { return i.exists ? inv.delete().catch(function () {}) : null; }).then(function () { return ref.get(); });
      });
    });
  }
  function onAuth(cb) {
    var first = true;
    auth.onAuthStateChanged(function (u) {
      if (!u) {
        // La restauration de session émet d'abord null : on attend avant de conclure.
        if (first) { first = false; setTimeout(function () { if (!auth.currentUser) { profile = null; cb(null); } }, 1500); return; }
        // Après un refus, la déconnexion forcée ne doit pas effacer le motif affiché
        var m = denyMsg; denyMsg = null; profile = null; cb(null, m || undefined); return;
      }
      first = false;
      function deny(m) { denyMsg = m; loginPending = false; cb(null, m); auth.signOut(); }
      ensureProfile(u).then(function (d) {
        var x = d.data();
        if (x.pending) { deny('Compte en attente de validation par un administrateur.'); return; }
        if (x.active !== true) { deny('Compte inactif. Contacter un administrateur.'); return; }
        profile = { uid: u.uid, email: u.email, name: x.name || u.email, role: x.role };
        if (loginPending) {
          loginPending = false;
          log('login', 'Connexion');
          db.doc('users/' + u.uid).update({ lastLogin: TS() }).catch(function () {});
        }
        if (x.role === 'admin') purge();
        cb(profile);
      }, function (e) { deny('Accès refusé : ' + e.message); });
    });
  }
  function signIn(email, pw) {
    loginPending = true;
    return auth.signInWithEmailAndPassword(email, pw).catch(function (e) { loginPending = false; throw e; });
  }
  function signOut(reason) {
    var p = profile ? Promise.all([log('logout', reason || 'Déconnexion'), presenceStop()]) : Promise.resolve();
    return p.then(function () { profile = null; return auth.signOut(); });
  }
  function resetPasswordEmail(email) { return auth.sendPasswordResetEmail(email); }
  function changeOwnPassword(oldPw, newPw) {
    var u = auth.currentUser, cred = firebase.auth.EmailAuthProvider.credential(u.email, oldPw);
    return u.reauthenticateWithCredential(cred).then(function () { return u.updatePassword(newPw); }).then(function () { return log('password_self', 'Changement de son mot de passe'); });
  }

  /* ---- Configuration (grilles, agences, règles) ---- */
  function getConfig() { return db.doc('config/global').get().then(function (d) { return d.exists ? d.data().cfg : null; }); }
  function saveConfig(cfg, what) {
    return db.doc('config/global').set({ cfg: clean(cfg), updatedAt: TS(), updatedBy: profile.email }).then(function () { return log('config', what || 'Modification des grilles / règles'); });
  }

  /* ---- Mois de facturation ---- */
  function listMonths() {
    return db.collection('months').get().then(function (q) {
      return q.docs.map(function (d) { var x = d.data(); x.id = d.id; x.updatedAt = tsToIso(x.updatedAt); x.closedAt = tsToIso(x.closedAt); delete x.ov; return x; });
    });
  }
  function getMonth(id) {
    return db.doc('months/' + id).get().then(function (d) {
      if (!d.exists) return null; var x = d.data(); x.id = d.id; x.updatedAt = tsToIso(x.updatedAt); x.closedAt = tsToIso(x.closedAt); return x;
    });
  }
  function saveMonth(id, patch) {
    var p = clean(patch); p.updatedAt = TS(); p.updatedBy = profile.email;
    if (patch.status === 'clos') { p.closedAt = TS(); p.closedBy = profile.email; }
    return db.doc('months/' + id).set(p, { mergeFields: Object.keys(p) });
  }

  /* ---- Exports Odoo ---- */
  function uploadImport(month, file) {
    var ref = db.doc('months/' + month), existed = false, meta;
    return ref.get().then(function (d) {
      if (d.exists && d.data().status === 'clos') throw new Error('Mois clôturé : le rouvrir avant d\'importer.');
      existed = d.exists;
      var id = newId();
      return putBlob('months/' + month + '/files/' + id, file, { id: id, kind: 'import' });
    }).then(function (m) {
      meta = m;
      var p = { files: FV.arrayUnion(meta), updatedAt: TS(), updatedBy: profile.email };
      if (!existed) { p.status = 'ouvert'; p.ov = {}; var mi = /^(.+)_(\d{4}-\d{2})$/.exec(month) || [null, month.split('_')[0], month.split('_')[1]]; p.ag = mi[1]; p.month = mi[2]; }
      return ref.set(p, { merge: true });
    }).then(function () { return log('import', file.name + ' · SHA-256 ' + meta.sha256.slice(0, 16), month); }).then(function () { return meta; });
  }
  function loadImportRows(meta) {
    return getFileBytes(meta).then(function (buf) {
      var wb = XLSX.read(new Uint8Array(buf), { type: 'array', raw: false, cellDates: false });
      return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
    });
  }
  function deleteImport(month, meta) {
    return deleteFile(meta).then(function () {
      return db.doc('months/' + month).update({ files: FV.arrayRemove(meta), updatedAt: TS(), updatedBy: profile.email });
    }).then(function () { return log('import_delete', meta.name, month); });
  }

  /* ---- Factures PDF (contrôle) ---- */
  function listPdfs(month) {
    return db.collection('months/' + month + '/pdfs').orderBy('at').get().then(function (q) { return q.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }); });
  }
  function uploadPdf(month, file) {
    var id = newId();
    return putBlob('months/' + month + '/files/' + id, file, { id: id, kind: 'pdf' });
  }
  function getPdfBytes(meta) { return getFileBytes(meta); }
  function savePdfResult(month, meta, result) {
    var doc = clean(meta); doc.result = clean(result);
    if (doc.result.lines && doc.result.lines.length > 400) doc.result.lines = doc.result.lines.slice(0, 400);
    return db.doc('months/' + month + '/pdfs/' + meta.id).set(doc).then(function () { return log('pdf_control', meta.name + ' : ' + result.status, month); });
  }
  function deletePdf(month, meta) {
    return deleteFile(meta).then(function () { return db.doc('months/' + month + '/pdfs/' + meta.id).delete(); })
      .then(function () { return log('pdf_delete', meta.name, month); });
  }

  /* ---- Documents de référence des agences ---- */
  function uploadAgencyDoc(code, kind, file) {
    var id = String(code).replace(/[^\w-]/g, '') + '_' + kind + '_' + newId();
    return putBlob('agencyFiles/' + id, file, { kind: kind, agency: String(code) });
  }

  /* ---- Transports ---- */
  function listTransports() { return db.collection('transports').orderBy('createdAt', 'desc').limit(1000).get().then(function (q) { return q.docs.map(function (d) { var x = d.data(); x.id = d.id; x.createdAt = tsToIso(x.createdAt); return x; }); }); }
  function addTransport(t) { var x = clean(t); x.createdAt = TS(); x.createdBy = profile.email; return db.collection('transports').add(x).then(function (r) { return log('transport', (t.date || '') + ' ' + t.cp + ' ' + t.veh + ' ' + t.total + ' €').then(function () { return r.id; }); }); }
  function updateTransport(id, patch) { var x = clean(patch); x.updatedAt = TS(); x.updatedBy = profile.email; return db.doc('transports/' + id).update(x).then(function () { return log('transport', id + ' ' + JSON.stringify(patch)); }); }
  function deleteTransport(id) { return db.doc('transports/' + id).delete().then(function () { return log('transport', 'Suppression ' + id); }); }

  /* ---- Utilisateurs ----
     Création : l'admin déclare l'e-mail et le rôle (invitation), puis crée le compte dans la console Firebase
     (Authentication → Ajouter un utilisateur). Au premier accès, le compte prend le rôle de l'invitation. */
  function listUsers() {
    return Promise.all([db.collection('users').get(), db.collection('invites').get()]).then(function (r) {
      var U = r[0].docs.map(function (d) { var x = d.data(); x.uid = d.id; x.lastLogin = tsToIso(x.lastLogin); x.createdAt = tsToIso(x.createdAt); return x; });
      var known = U.map(function (u) { return lower(u.email); });
      r[1].docs.forEach(function (d) {
        if (known.indexOf(d.id) >= 0) return;
        var x = d.data(); U.push({ uid: 'invite:' + d.id, email: d.id, name: x.name || '', role: x.role, active: false, invite: true, createdAt: tsToIso(x.at) });
      });
      return U;
    });
  }
  function createUser(u) {
    var em = lower(u.email);
    return db.doc('invites/' + em).set({ name: String(u.name || '').slice(0, 80), role: u.role, at: TS(), by: profile.email })
      .then(function () { return log('user_create', 'Invitation ' + em + ' (' + u.role + ')'); });
  }
  function updateUser(uid, patch) {
    if (String(uid).indexOf('invite:') === 0) {
      var em = uid.slice(7);
      if (patch.remove || patch.active === true) return db.doc('invites/' + em).delete().then(function () { return log('user_update', 'Invitation supprimée ' + em); });
      var p = {}; if (patch.role) p.role = patch.role; if (patch.name !== undefined) p.name = String(patch.name).slice(0, 80);
      return db.doc('invites/' + em).update(p).then(function () { return log('user_update', 'Invitation ' + em + ' : ' + JSON.stringify(p)); });
    }
    if (profile && uid === profile.uid && (patch.role !== undefined || patch.active === false)) return Promise.reject(new Error('Un administrateur ne peut pas modifier son propre rôle ni se désactiver'));
    var q = {};
    if (patch.role !== undefined) q.role = patch.role;
    if (patch.active !== undefined) { q.active = !!patch.active; if (patch.active) q.pending = false; }
    if (patch.name !== undefined) q.name = String(patch.name).slice(0, 80);
    var ref = db.doc('users/' + uid);
    return ref.get().then(function (d) {
      if (!d.exists) throw new Error('Utilisateur inconnu');
      return ref.update(q).then(function () { return log('user_update', d.data().email + ' : ' + JSON.stringify(q)); });
    });
  }
  // Sans serveur, l'admin ne fixe pas le mot de passe : il envoie l'e-mail de réinitialisation Firebase.
  function setPassword(uid) {
    return db.doc('users/' + uid).get().then(function (d) {
      if (!d.exists) throw new Error('Utilisateur inconnu');
      return auth.sendPasswordResetEmail(d.data().email).then(function () { return log('password_set', 'E-mail de réinitialisation envoyé à ' + d.data().email); });
    });
  }

  /* ---- Conservation 18 mois : lancée à la connexion d'un administrateur, au plus une fois par jour ---- */
  function purge() {
    var ref = db.doc('config/purge');
    return ref.get().then(function (d) {
      var last = d.exists && d.data().lastRun && d.data().lastRun.toDate ? d.data().lastRun.toDate() : null;
      if (last && Date.now() - last.getTime() < 86400000) return;
      var c = new Date(); c.setDate(1); c.setMonth(c.getMonth() - (RETENTION_MONTHS - 1));
      var cutoff = c.getFullYear() + '-' + String(c.getMonth() + 1).padStart(2, '0');
      return ref.set({ lastRun: TS(), by: profile.email }).then(function () { return db.collection('months').get(); }).then(function (q) {
        var old = q.docs.filter(function (m) { return String(m.data().month || m.id.split('_').pop()) < cutoff; });
        return old.reduce(function (p, m) {
          return p.then(function () { return db.collection('months/' + m.id + '/files').get(); })
            .then(function (f) { return Promise.all(f.docs.map(function (x) { return deleteFile({ path: x.ref.path }); })); })
            .then(function () { return db.collection('months/' + m.id + '/pdfs').get(); })
            .then(function (f) { return Promise.all(f.docs.map(function (x) { return x.ref.delete(); })); })
            .then(function () { return m.ref.delete(); })
            .then(function () { return log('purge', 'Mois ' + m.id + ' supprimé (conservation ' + RETENTION_MONTHS + ' mois)', m.id); });
        }, Promise.resolve());
      }).then(function () {
        var lim = firebase.firestore.Timestamp.fromDate(new Date(Date.now() - LOG_RETENTION_DAYS * 86400000));
        return db.collection('logs').where('at', '<', lim).limit(400).get().then(function (q) {
          if (q.empty) return; var b = db.batch(); q.docs.forEach(function (x) { b.delete(x.ref); }); return b.commit();
        });
      });
    }).catch(function (e) { console.warn('Purge non effectuée : ' + e.message); });
  }

  /* ---- Discussion : présence + conversations (presence/{uid}, chats/{id}, chats/{id}/messages/{id}) ---- */
  var presT = null;
  function presenceStart() {
    var u = auth.currentUser; if (!u || !profile) return;
    function beat() { db.doc('presence/' + u.uid).set({ uid: u.uid, name: profile.name || profile.email, email: profile.email, at: TS(), online: true }).catch(function () {}); }
    beat(); clearInterval(presT); presT = setInterval(beat, 60000);
    window.addEventListener('beforeunload', function () { db.doc('presence/' + u.uid).set({ online: false, at: TS() }, { merge: true }); });
  }
  function presenceStop() { clearInterval(presT); var u = auth.currentUser; if (u) return db.doc('presence/' + u.uid).set({ online: false, at: TS() }, { merge: true }).catch(function () {}); }
  function onPresence(cb) {
    return db.collection('presence').onSnapshot(function (q) { cb(q.docs.map(function (d) { var x = d.data(); x.uid = d.id; x.at = x.at && x.at.toMillis ? x.at.toMillis() : Date.now(); return x; })); }, function (e) { console.warn('Présence : ' + e.message); });
  }
  function onChats(cb) {
    var u = auth.currentUser; if (!u) return function () {};

var KB_RULES = "# Règles de calcul — facturation logistique OTIS (v7, 22/10/2026)\n\nRéférence du moteur de la plateforme. Toute évolution de règle se fait ici d'abord.\n\n## Sources\n- Odoo WMS, 2 exports par agence : « Fichier Manutention » (mouvements) et « Fichier Client Stockage » (colis en stock sur la période).\n- Grilles : OTIS 2022 (01/04/2022, XLS contrat v2), Tours The Link (01/01/2023), Transport 2023 (01/07/2023).\n- Process OTIS : AG 495 et 496 = cas 2, sans commande client, 1 facture par affaire avec les n° d'appareils, sans annexe. AG 58 et NSA = voir règles dédiées ci-dessous. Transport = cas 1, 1 facture par livraison.\n\n## Règle AG 58 (OTIS TERTIAIRE, document « AGENCE_58.v2 », intégrée en v1.8, appliquée automatiquement depuis v1.10)\n- Envoi du devis : oui ; n° de commande OTIS : oui → Process OTIS = cas 1 (pro forma titrée « Devis pro forma »).\n- Paramètre « Une facture par » = « Contremaître × Contrats / FHR » : 2 factures par contremaître.\n  - Facture « Contrats » : toutes les lignes (stockage et mouvements) dont le n° de commande Odoo ne contient pas « FHR ». N° de commande = tous les n° de commande des lignes facturées (dédoublonnés, triés). Objet = « LOGISTIQUE – <MOIS AAAA> – CONTRATS ».\n  - Facture « FHR » : toutes les lignes dont le n° de commande contient « FHR » (insensible à la casse). N° de commande = « FHR ». Objet = « LOGISTIQUE – <MOIS AAAA> – FHR ».\n  - Code contremaître = code paramétré dans Odoo, sur les deux factures.\n- Annexe : non.\n- Pas de blocage « affaire non identifiée » (réservé aux agences facturées par affaire) : les n° AG 58 (ex. affaire 100MMEO, appareil GAA26140M381) ne suivent pas le format 45K….\n- v1.10 : toute agence dont le libellé, le client Odoo ou le code contient « AG 58 » reçoit automatiquement ce paramétrage (une seule fois, marqueur `rule58 = v2`, tracé au journal) ; modifiable ensuite dans Paramètres.\n- Contrôle PDF : rapprochement par code contremaître + type (FHR si le PDF contient « FHR » et pas « CONTRATS »), contrôle « Type de facture » ajouté.\n\n## Règle NSA (Process OTIS, intégrée en v3.9, 22/10/2026)\n- Process OTIS : NSA = cas 2 (sans commande client), 1 facture par appareil + 1 facture pour l'outillage, sans annexe.\n- Toute agence dont le libellé, le client Odoo ou le code contient « NSA » reçoit automatiquement « Une facture par » = « Appareil », cas 2, sans annexe (une seule fois, marqueur `ruleNSA = v1`, tracé au journal) ; modifiable ensuite dans Paramètres. Supprime le blocage « Affaire non identifiée » (106 lignes NSA en septembre 2026), qui ne vaut que pour les agences facturées par affaire.\n- N° d'appareil NSA au format `R5K7C325` / `R5N7A728`. Code OTIS reconnu = 7 à 12 caractères alphanumériques mêlant lettres et chiffres. Affaire = format `45K/45N + RX|F4|A2…` uniquement ; tout autre code isolé est un appareil.\n  - « R5N7A728 », « NSA - R5N7A728 », « OUTILLAGE / R5K7C325 », « R5K7C325 - OUTILLAGE », « NSA R5N7A728 » → appareil, sans affaire.\n  - Libellé sans code (ex. « OUTILLAGE ») → facture portant ce libellé.\n- Contrôle PDF NSA (constat FAC-26-09-153) : l'appareil est porté par l'objet « LOGISTIQUE SEPTEMBRE 2026 - R5N7A728 » ; destinataire « NSA, Envoi factures NSA », sans « AG nnn ». Agence contrôlée par un mot distinctif du libellé de l'agence présent dans le PDF. Rapprochement par appareil, contrôle « Appareil » ajouté ; un appareil de l'objet inconnu du mois calculé est signalé.\n\n## Suivi des anomalies — identifiant des mois (v3.9)\n- Agence et mois relus depuis l'identifiant `<code agence>_<AAAA-MM>`. Un code agence contenant « _ » (ex. Tour Triangle) était lu de travers : agence et mois absents du suivi alors que les exports étaient importés.\n\n## Identification\n- N° de commande Odoo = `APPAREIL / AFFAIRE` (ex. `45K1BZY5 / 45KRXI9F`). Affaire OTIS = 8 caractères.\n- Affaire absente (retour chantier) : reprise de l'appareil, puis de l'historique du colis ; sinon ligne bloquée jusqu'à saisie ADV (agences facturées par affaire uniquement).\n- Client = « False » : ligne bloquée jusqu'à rattachement (suggestion par code contremaître ou n° de BR).\n- Contrôle « N° d'appareil affecté à plusieurs affaires » (APPAREIL_MULTI_AFF, v2.6) : sur l'affaire finalement retenue (n° de commande, déduction, saisie ou correction ADV), lignes exclues ignorées, toutes agences. Gravité « À vérifier » : les lignes restent facturées, mais la clôture du mois est refusée tant qu'un appareil porte plusieurs affaires. Correction par « Facturer X sur Y » (table de correspondance d'affaires) ou saisie ligne à ligne. Remplace l'ancien contrôle AFFAIRE_MULTI, qui ne regardait que le n° de commande brut. Cas réel août 2026 : 45K1CL53 sur 45KRXPG (216 l.) et 45KRXLPG (7 l.).\n\n## Manutention (entrée ou sortie), par colis et par mouvement\n- `UP = max(volume m³ ; poids t)` (lecture « M3/T » de la grille).\n- `montant = arrondi₂( max( 9,2664 × UP ; minimum ) )`.\n- Minimum manuel 3,796 € (→ 3,80) si volume < 0,250 m³ et poids ≤ 20 kg ; sinon minimum chariot 4,888 € (→ 4,89).\n\n## Stockage, par colis et par période\n- Jours = bornes incluses, de max(entrée, 1er du mois) à min(sortie, dernier jour du mois).\n- Export sans dates (AG 496) : entrée/sortie reprises des mouvements du mois ; à défaut colis présent tout le mois. Jours Odoo utilisés seulement si aucune date exploitable (plafonnés au mois).\n- Tranche : ≥ 22 j = mois (6,76) ; 15–21 j = quinzaine + semaine (5,148) ; 8–14 j = quinzaine (3,38) ; 1–7 j = semaine (1,768).\n- Surface facturée = volume × coefficient : ≥ 1 m³ 2,6832 ; 0,5–0,999 3,224 ; 0,25–0,499 3,744 ; < 0,25 4,2952. (Tours : surface au sol × 1,50.)\n- `montant = arrondi₂(surface facturée × prix de la tranche)`.\n\n## Minimum m² par appareil et par mois — clause abandonnée (décision du 02/10/2026)\n- La clause de la grille OTIS n'est plus appliquée depuis des années : aucune ligne « complément » n'est facturée.\n- v2.6 : règle commune « Minimum 30 m² par appareil » = Non appliqué et champ « Minimum m² par appareil et par mois » = 0 sur toutes les grilles (migration unique à la première connexion d'un admin, marqueur `rules.min30Off`, tracée au journal). Valeurs par défaut du moteur alignées (min30 = 0, rules.min30 = false).\n- Les mois déjà clôturés gardent leur grille figée.\n- Mécanique conservée si réactivée : par agence × appareil, si somme des surfaces facturées au mois < seuil, complément `(seuil − somme) × prix mois`.\n- Impact sur août 2026 (4 exports) : 53 843,97 € HT avec l'ancienne clause → 51 744,42 € HT sans (− 2 099,55 €). AG 495 seule : 9 813,62 € HT.\n\n## Arrondis\n- Au centime par ligne colis ; totaux = somme des lignes arrondies ; TVA 20 %.\n\n## Contrôle des factures Odoo (PDF) — lecture et rapprochement (v2.18, 20/10/2026)\n- Concordance des libellés de lignes Odoo (validée le 20/10/2026) :\n  - « PRESTATION LOGISTIQUE - ENTREES » = Entrées\n  - « PRESTATION LOGISTIQUE - SORTIES » = Sorties\n  - « [STOCK] PRESTATION LOGISTIQUE - STOCKAGE » = Stockage\n- Montant de la ligne = dernier montant de la ligne (colonne MONTANT). Total = « Montant hors taxes ». Famille absente du PDF alors que le total est lu = 0.\n- Lignes lues entre l'en-tête « DESCRIPTION » et « Montant hors taxes ». Libellé hors concordance : mots-clés entrée / sortie / stockage dans la description (ligne suivante comprise) ; sinon ligne signalée « sans famille reconnue ».\n- Affaire et appareils lus dans « N° de commande » (ex. « AFFAIRE : 45NRXI1F Appareils : 45N1CPT6 »), y compris quand un code est coupé par la mise en page du PDF et quand un même code est à la fois affaire et appareil.\n- Factures AG 58 (constat sur FAC-26-09-156, -157, -195) : destinataire « OTIS TERTIAIRE AG 58, Envoi factures OTIS AG 58 », code contremaître vide, ni affaire ni appareil ; seul identifiant = N° de commande OTIS « OJ… » (+ n° de devis). Rapprochement : n° OJ mémorisé par contremaître et type (Contrats / FHR) à la première association manuelle validée par un administrateur (Paramètres de l'agence, `poMap`), puis automatique ; à défaut, proposition par les montants Entrées / Sorties / Stockage (même type, facture sans PDF).\n- Rapprochement : automatique (affaire / appareil / code contremaître, puis agence et total HT) ou manuel (une facture Odoo ↔ une ou plusieurs factures calculées ; raisons du non-rapprochement affichées avant validation ; dissociation possible).\n- Écart = total HT Odoo − total HT outil. Contrôle détaillé (onglet E) : écart par famille et ligne à ligne ; montant Odoo d'une ligne = fichier de calcul déposé, sinon colonne « Prix » des exports Odoo.\n\n## Contrôle août 2026 (4 exports du 01/09/2026)\n- Total HT sans minimum m² : 51 744,42 € sur 49 affaires (E 7 965,41 · S 5 447,56 · stockage 38 331,45). Calcul initial vérifié ligne à ligne par un second calcul indépendant : 0 écart.\n- 14 lignes bloquantes hors montants : 10 « RETOUR CHANTIER » sans affaire, 4 lignes Client = False.\n\n## Incohérences Odoo constatées (août 2026)\n- Tarif manutention Odoo = 9,50 €/m³ et minimum 4,30 €, volume seul : ≠ grille (9,2664 €/m³ sur m³/t, min. 4,89 / 3,80).\n- Stockage Odoo = surface au sol × jours × 0,4056 €/m²/j : méthode différente de la grille (volume × coef × prix de tranche).\n- « Nombre de jour en stock » faux : 240 lignes changent de tranche, 168 lignes > 31 jours (jusqu'à 155).\n- Export stockage AG 496 incomplet : pas de dates, de type de stockage ni de prix.\n- 112 sorties datées en stock sans mouvement de sortie dans le fichier Manutention (sorties potentiellement non facturées).\n- 103 mouvements sans n° de colis ; 74 doubles mouvements (même colis, même opération).\n- Affaire tronquée : `45KRXPG` (216 lignes) au lieu de `45KRXLPG` pour l'appareil 45K1CL53.\n- Contremaître J.-B. FAVREAU sous deux codes (49630 / 49632).\n\n## Points à valider\n1. Unité payante m³/t (max) plutôt que m³ seul : +~290 €/mois sur août.\n2. Tranche 15–21 jours facturée quinzaine + semaine.\n";
