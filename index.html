<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Facturation OTIS LEGAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--DEMO_BANNER-->
<section class="login" id="login" hidden>
  <div class="login-card">
    <div class="hd"><h1>Facturation OTIS</h1><span style="opacity:.7;font-family:var(--f-label)">LEGAA · accès réservé</span></div>
    <form id="loginForm" autocomplete="on">
      <div class="fld"><label class="lbl" for="lg_email">E-mail</label><input id="lg_email" type="email" autocomplete="username" required></div>
      <div class="fld"><label class="lbl" for="lg_pw">Mot de passe</label><input id="lg_pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" type="submit">Se connecter</button>
      <div class="msg" id="loginMsg" role="alert"></div>
    </form>
  </div>
</section>
<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <button class="brand" data-home title="Accueil"><h1>Facturation OTIS</h1><span>LEGAA</span></button>
    <span class="modname" id="modname"></span>
    <span id="src" class="num" style="opacity:.7;margin-left:auto"></span>
    <button class="who" id="who" data-acc title="Mon compte"></button>
  </div>
  <nav class="tabs" role="tablist" id="tabs" hidden></nav>
</header>
<main id="main"></main>
</div>
<div id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="ctip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<!--STORE_SCRIPTS-->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store-firebase.js"></script>
<!--/STORE_SCRIPTS-->
<script src="engine.js"></script>
<script src="pdfcheck.js"></script>
<script src="app.js"></script>
</body>
</html>
